<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Espace Gérant — Bouliedou</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest-gerant.json">
<meta name="theme-color" content="#0C4A39">
<link rel="apple-touch-icon" href="/bgb-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BGB Gérant">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0C4A39; --green-deep:#06382C; --gold:#C2993F; --gold-soft:#D8B65F;
  --bg:#F4F1E7; --surface:#FFFFFF; --surface-2:#FAF7EE; --line:#E7E1CF;
  --ink:#1B2821; --muted:#6B7A70; --ink-soft:#3A4A41;
  --good:#1F8F5F; --good-bg:#E4F2EA; --warn:#B07D18; --warn-bg:#F7ECD2;
  --crit:#C0392B; --crit-bg:#F7E3E0; --neutral:#5B6B7A; --neutral-bg:#E8ECF0;
  --shadow:0 1px 2px rgba(12,44,44,.05),0 10px 26px -16px rgba(12,44,44,.35);
  --sheet-shadow:0 -8px 40px -12px rgba(12,44,44,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,.mont{font-family:"Montserrat",sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* login */
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px 24px;width:100%;max-width:400px}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.login-logo svg,.login-logo img{width:62px;height:auto}
.login-logo b{font-family:"Montserrat";font-weight:800;color:var(--green);font-size:18px;letter-spacing:.3px}
.login-logo span{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.login h1{font-size:19px;text-align:center;margin:0 0 4px}
.login p.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 20px}

/* header */
.app-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--green-deep);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg,.brand img{width:32px;height:auto;flex:none}
.app-head .brand svg{--mk-stroke:#F5EFDE;--mk-gold:#D8B65F}
.brand .t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand .t b{font-family:"Montserrat";font-weight:800;font-size:15px}
.brand .t span{font-size:10px;color:var(--gold-soft);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.role-badge{font-size:10px;font-weight:700;background:var(--gold);color:#201604;border-radius:999px;padding:3px 9px;text-transform:uppercase;letter-spacing:.04em}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.head-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:700}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 96px}
.view-title{font-weight:800;font-size:22px;margin:4px 0 2px}
.view-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

.home-hi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:2px 0 14px}
.hi-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);cursor:pointer;font:inherit}
.hi-card .hi-l{font-size:12px;font-weight:700;color:var(--muted)}
.hi-card .hi-v{font-family:"Montserrat";font-weight:800;font-size:21px;margin-top:6px;letter-spacing:-.01em}
.hi-card .hi-s{font-size:11px;color:var(--muted);margin-top:2px}
@media (max-width:420px){.hi-card .hi-v{font-size:19px}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .lab i{width:9px;height:9px;border-radius:50%}
.kpi .val{font-family:"Montserrat";font-weight:800;font-size:22px;margin-top:8px;letter-spacing:-.01em}
.kpi .val.sm{font-size:18px}

.section-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.section-h h2{font-size:15px;font-weight:800;margin:0}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--gold)}

.clist{display:flex;flex-direction:column;gap:10px}
.c-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;text-align:left;width:100%;color:inherit}
.c-av{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Montserrat";font-weight:800;color:var(--green);flex:none}
.c-main{flex:1;min-width:0}
.c-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.solde{font-size:12.5px;font-weight:800;color:var(--crit);white-space:nowrap;flex:none}
.solde.ok{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;font-weight:700;font-size:14.5px;padding:12px 18px}
.btn-green{background:var(--green);color:#fff}
.btn-gold{background:var(--gold);color:#201604}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-danger{background:var(--crit-bg);color:var(--crit)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.tabbar{position:sticky;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--muted);border-radius:12px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:700}
.tab.on{color:var(--green)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:800}
.add-link{background:none;border:0;color:var(--green);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.add-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}

.d-head{background:linear-gradient(155deg,var(--green) 0%,var(--green-deep) 100%);color:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.d-head .av{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:"Montserrat";font-weight:800;font-size:20px;margin-bottom:10px}
.d-head h2{margin:0;font-size:20px}
.d-head .t{color:var(--gold-soft);font-size:13px;font-weight:600;margin-top:3px}
.d-actions{display:flex;gap:9px;margin:14px 0 2px;flex-wrap:wrap}
.d-actions .btn{flex:1;padding:11px;min-width:120px}
.info-row{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-row .k{color:var(--muted);min-width:72px;font-size:12.5px;font-weight:600;text-transform:uppercase}
.money-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.money-grid .m{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.money-grid .m .lab{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.money-grid .m .v{font-family:"Montserrat";font-weight:800;font-size:15px;margin-top:4px}
.money-grid .m.due .v{color:var(--crit)} .money-grid .m.due.ok .v{color:var(--good)}
.ana-sub{font-size:12px;color:var(--muted);margin:-2px 0 12px;line-height:1.5}
.ana-leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
.ana-leg.col{display:flex;flex-direction:column;gap:7px;margin-top:0;min-width:0;flex:1 1 auto}
.ana-leg-i{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--ink);line-height:1.35;min-width:0}
.ana-leg-i i{width:11px;height:11px;border-radius:3px;flex:none;margin-top:2px}
.ana-leg-i b{font-weight:800}
.ana-donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .top{display:flex;justify-content:space-between;gap:10px}
.item .lab{font-weight:600;font-size:14px}
.item .amt{font-weight:800;font-size:14px;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:1px}
.item .del{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;flex:none}
.item-empty{color:var(--muted);font-size:13px;text-align:center;padding:12px 0}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.nouvelle{background:var(--warn-bg);color:var(--warn)} .pill.validée{background:var(--neutral-bg);color:var(--neutral)}
.pill.livrée{background:var(--good-bg);color:var(--good)} .pill.annulée{background:var(--line);color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;box-shadow:var(--sheet-shadow);max-height:92vh;overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 10px}
.sheet h3{margin:4px 0 16px;font-size:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field textarea{min-height:64px;resize:vertical}
.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--green);flex:none}
.chk small{color:var(--muted);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.pbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft))}
.sheet-actions{display:flex;gap:10px;margin-top:8px}.sheet-actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:var(--crit-bg);color:var(--crit);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.netbar{display:none;padding:8px 14px;font-size:12.5px;font-weight:700;text-align:center;flex:none}
.netbar.show{display:block}
.netbar.off{background:var(--warn-bg);color:var(--warn)}
.netbar.sync{background:var(--neutral-bg);color:var(--neutral)}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.lockscreen{position:fixed;inset:0;z-index:9999;background:var(--green-deep);display:flex;align-items:center;justify-content:center;padding:24px}
.lock-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:30px 24px;width:100%;max-width:380px;text-align:center}
.lock-ic{font-size:38px;line-height:1;margin-bottom:8px}
.lock-card h2{margin:0 0 6px;font-size:20px}
.lock-card p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.5}
.lock-logout{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;margin-top:14px;text-decoration:underline}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* period filter chips */
.perbar{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;scrollbar-width:none}
.perbar::-webkit-scrollbar{display:none}
.perchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.perchip.on{background:var(--green);color:#fff;border-color:var(--green)}
/* stock synthesis card */
.stock-syn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);cursor:pointer;font:inherit;margin-top:12px}
.stock-syn .ss-h{display:flex;justify-content:space-between;align-items:baseline;font-family:"Montserrat";font-weight:800;font-size:15px;color:var(--ink);margin-bottom:8px}
.stock-syn .ss-h b{font-size:18px}
.stock-syn .ss-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13.5px;color:var(--muted)}
.stock-syn .ss-row span{display:flex;align-items:center;gap:8px}
.stock-syn .ss-row i{width:9px;height:9px;border-radius:50%;display:inline-block}
.stock-syn .ss-row b{color:var(--ink);font-weight:700}
.stock-syn .ss-row.tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:9px;color:var(--ink);font-weight:800}
.stock-syn .ss-s{font-size:11px;color:var(--muted);margin-top:8px}
/* category rollup */
.catroll .cr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.catroll .cr:last-child{border-bottom:0}
.catroll .cr .nm{font-weight:700}
.catroll .cr .q{font-size:12px;color:var(--muted);margin-top:2px}
/* assistant : pas de suppression */
.role-assistant .del,.role-assistant .btn-danger{display:none!important}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="hex" viewBox="0 0 300 300">
    <path d="M150 12 L269.5 81 L269.5 219 L150 288 L30.5 219 L30.5 81 Z" fill="none" stroke="var(--mk-stroke,#0C4A39)" stroke-width="15" stroke-linejoin="round"/>
    <path d="M150 12 L269.5 81" fill="none" stroke="var(--mk-gold,#C2993F)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="156" text-anchor="middle" dominant-baseline="central" font-size="100" font-family="Montserrat,sans-serif" font-weight="800" letter-spacing="-3"><tspan fill="var(--mk-stroke,#0C4A39)">B</tspan><tspan fill="var(--mk-gold,#C2993F)">G</tspan><tspan fill="var(--mk-stroke,#0C4A39)">B</tspan></text>
  </symbol>
</defs></svg>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="login-card">
    <div class="login-logo">
      <img src="/logo-emblem.svg" alt="Bouliedou Global Business">
      <b>BOULIEDOU</b><span>Espace gérant</span>
    </div>
    <h1>Connexion</h1>
    <p class="sub">Réservé au gérant et à l'assistant.</p>
    <div class="banner" id="loginErr" hidden></div>
    <form id="loginForm">
      <div class="field"><label for="le">E-mail</label><input id="le" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lp">Mot de passe</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-green btn-block" id="loginBtn" type="submit">Se connecter</button>
    </form>
  </div>
</div>

<div class="loading" id="bootView" hidden>Chargement…</div>

<!-- APP -->
<div id="appView" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
  <header class="app-head">
    <div class="brand">
      <img src="/logo-emblem-cream.svg" alt="Bouliedou Global Business">
      <div class="t"><b>Espace gérant</b><span>Bouliedou</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="head-btn" id="bellBtn" data-go="notifs" style="position:relative" aria-label="Alertes">🔔<span class="bell-badge" id="bellBadge" hidden></span></button>
      <span class="role-badge" id="roleBadge">—</span>
      <button class="head-btn" id="logoutBtn">Quitter</button>
    </div>
  </header>
  <div class="netbar" id="netbar"></div>
  <main><div class="wrap" id="root"></div></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Accueil</span></button>
    <button class="tab" data-tab="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/></svg><span>Clients</span></button>
    <button class="tab" data-tab="orders"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4z"/><path d="M3 6h18"/></svg><span>Commandes</span></button>
    <button class="tab" data-tab="menu"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Gestion</span></button>
  </nav>
</div>

<div class="lockscreen" id="lockscreen" hidden>
  <div class="lock-card">
    <div class="lock-ic">🔒</div>
    <h2>Espace verrouillé</h2>
    <p>Par sécurité, l'application s'est verrouillée après 5 minutes d'inactivité. Entrez votre mot de passe pour continuer.</p>
    <div class="banner" id="lockErr" hidden></div>
    <form id="lockForm">
      <div class="field"><input id="lockInput" type="password" autocomplete="current-password" placeholder="Mot de passe"></div>
      <button class="btn btn-green btn-block" type="submit">Déverrouiller</button>
    </form>
    <button type="button" class="btn btn-ghost btn-block" id="bioBtn" hidden style="margin-top:10px">👆 Empreinte / Face ID</button>
    <button type="button" class="lock-logout" id="lockLogout">Se déconnecter</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

function queueAdd(op){ var q=queueGet(); op.localId='loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); op.queued_at=new Date().toISOString(); op.tries=0; q.push(op); queueSet(q); return op; }

function isNetErr(err){
  if(!navigator.onLine) return true;
  var m=((err&&(err.message||err.msg))||err||"").toString().toLowerCase();
  return m.indexOf('fetch')>=0||m.indexOf('network')>=0||m.indexOf('failed')>=0||m.indexOf('timeout')>=0||m.indexOf('offline')>=0;
}
async function applyOp(op){ return await sb.from(op.table).insert(op.payload); }
async function saveOp(op){
  if(navigator.onLine){
    try{
      var res=await applyOp(op);
      if(res&&res.error){ if(isNetErr(res.error)){ queueAdd(op); return {queued:true}; } return {error:res.error.message}; }
      return {ok:true};
    }catch(e){ if(isNetErr(e)){ queueAdd(op); return {queued:true}; } return {error:(e&&e.message)||'Erreur'}; }
  }
  queueAdd(op); return {queued:true};
}
async function syncQueue(){
  if(NET.syncing||!navigator.onLine){ renderSyncBar(); return; }
  var q=queueGet(); if(!q.length){ renderSyncBar(); return; }
  NET.syncing=true; renderSyncBar();
  var remain=[];
  for(var i=0;i<q.length;i++){ var op=q[i];
    try{ var res=await applyOp(op);
      if(res&&res.error){ op.tries=(op.tries||0)+1; if(!isNetErr(res.error)&&op.tries>=5) op._failed=true; remain.push(op); }
    }catch(e){ op.tries=(op.tries||0)+1; if(!isNetErr(e)&&op.tries>=5) op._failed=true; remain.push(op); }
  }
  queueSet(remain);
  NET.syncing=false;
  if(navigator.onLine){ try{ await loadAll(); }catch(e){} }
  render(); renderSyncBar();
  var done=q.length-remain.length;
  if(done>0) toast(done+' saisie(s) synchronisée(s) ✓');
}
function stripPending(arr){ return (arr||[]).filter(function(x){return !x._pending;}); }
function applyPendingToState(){
  S.deliveries=stripPending(S.deliveries); S.credits=stripPending(S.credits); S.payments=stripPending(S.payments);
  S.stock=stripPending(S.stock); S.expenses=stripPending(S.expenses);
  queueGet().forEach(function(op){
    var p=op.payload, base={id:op.localId,_pending:true,_failed:op._failed,created_at:op.queued_at};
    if(op.type==='deliv') S.deliveries.unshift(Object.assign({},p,base));
    else if(op.type==='credit') S.credits.unshift(Object.assign({},p,base));
    else if(op.type==='payment') S.payments.unshift(Object.assign({},p,base));
    else if(op.type==='stock') S.stock.unshift(Object.assign({},p,base));
    else if(op.type==='expense') S.expenses.unshift(Object.assign({},p,base));
  });
}

function bufToB64(buf){ var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s); }
function b64ToBuf(s){ var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a; }
async function hashSecret(secret, saltB64){
  var enc=new TextEncoder();
  var salt=saltB64?b64ToBuf(saltB64):crypto.getRandomValues(new Uint8Array(16));
  var k=await crypto.subtle.importKey('raw', enc.encode(String(secret)), {name:'PBKDF2'}, false, ['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:120000, hash:'SHA-256'}, k, 256);
  return { salt:bufToB64(salt), hash:bufToB64(bits) };
}
async function storeLock(secret){ try{ var lk=await hashSecret(secret); lsSet(LOCKKEY,{uid:curUid(), salt:lk.salt, hash:lk.hash}); }catch(e){} }
function hasLock(){ var r=lsGet(LOCKKEY,null); return !!(r&&r.uid===curUid()&&r.salt&&r.hash); }
async function verifyLock(entered){
  var r=lsGet(LOCKKEY,null); if(!(r&&r.uid===curUid()&&r.salt)) return false;
  try{ var lk=await hashSecret(entered, r.salt); return lk.hash===r.hash; }catch(e){ return false; }
}

/* --- dépenses réelles vs mouvements caisse↔banque --- */
function isCashMove(x){ return x && x.category==='mouvement_cb'; }
/* Paiement à un fournisseur (règle une dette) — sortie de caisse, mais PAS une charge d'exploitation */
function isSupplierPay(x){ return x && x.category==='paiement_fournisseur'; }
/* Apport (argent du propriétaire vers l'entreprise) / Retrait (de l'entreprise vers le propriétaire) */
function isOwnerMove(x){ return x && (x.category==='apport'||x.category==='retrait'); }
/* Les « dépenses » (charges) excluent les transferts caisse↔banque, les paiements fournisseurs et les apports/retraits */
function realExpenses(){ return S.expenses.filter(function(x){ return !isCashMove(x) && !isSupplierPay(x) && !isOwnerMove(x); }); }

  var buys=S.stock.filter(function(x){return x.kind==='entree' && x.paid===false;}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var pays=S.expenses.filter(isSupplierPay).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  return Math.max(0, buys-pays);
}

  function ens(n){ n=(n&&String(n).trim())||'Fournisseur'; if(!m[n]) m[n]={name:n,buys:0,pays:0}; return m[n]; }
  S.stock.forEach(function(x){ if(x.kind==='entree' && x.paid===false){ ens(x.supplier).buys+=Number(x.amount)||0; } });
  S.expenses.forEach(function(x){ if(isSupplierPay(x)){ ens(x.label).pays+=Number(x.amount)||0; } });
  return m;
}
/* --- Apports / retraits du propriétaire : net injecté dans l'entreprise --- */
function ownerTotals(){
  var apport=0, retrait=0;
  S.expenses.forEach(function(x){ var a=Number(x.amount)||0; if(x.category==='apport') apport+=a; else if(x.category==='retrait') retrait+=a; });
  return {apport:apport, retrait:retrait, net:apport-retrait};
}
/* --- Charges étalées : une dépense « payée d'avance » (prepaid_months = N) couvre N mois.
   La SORTIE DE CAISSE reste au jour du paiement (trésorerie inchangée), mais le COÛT
   est réparti sur les mois couverts, pour un bénéfice mensuel juste. --- */
function expMonths(x){
  var n=Math.max(1, Math.round(Number(x&&x.prepaid_months)||1));
  var d=String((x&&x.date)||"").slice(0,10); if(d.length<7) return [];
  var y=Number(d.slice(0,4)), m=Number(d.slice(5,7)), out=[];
  for(var i=0;i<n;i++){ var k=m-1+i, yy=y+Math.floor(k/12), mo=(k%12)+1; out.push(yy+'-'+(mo<10?'0':'')+mo); }
  return out;
}
function monthInPer(ym, per){
  if(per==='all'||!per) return true;
  var t=today(), y=ym.slice(0,4), mo=Number(ym.slice(5,7)), ty=t.slice(0,4), tmo=Number(t.slice(5,7));
  if(per==='year')     return y===ty;
  if(per==='semester') return y===ty && (mo<=6)===(tmo<=6);
  if(per==='quarter')  return y===ty && Math.floor((mo-1)/3)===Math.floor((tmo-1)/3);
  if(per==='month' || per==='week') return ym===t.slice(0,7); /* semaine ≈ mois courant pour une charge mensuelle */
  return true;
}
/* coût (charge) d'une dépense tombant dans la période (réparti si payé d'avance) */
function expCharge(x, per){
  var months=expMonths(x); if(!months.length) return 0;
  var amt=Number(x.amount)||0;
  if(per==='all'||!per) return amt;
  var portion=amt/months.length, c=0;
  months.forEach(function(ym){ if(monthInPer(ym,per)) c+=portion; });
  return c;
}
function expensesCharge(per){ return realExpenses().reduce(function(a,x){ return a+expCharge(x,per); },0); }
/* charge d'un mois précis 'AAAA-MM' (pour les courbes d'évolution) */
function expChargeOfMonth(x, key){ var ms=expMonths(x); return ms.indexOf(key)>=0 ? (Number(x.amount)||0)/ms.length : 0; }
/* --- trésorerie : flux caisse / banque pour une période (balances = période 'all') --- */
function payMethod(x){ return (x&&x.method==='banque')?'banque':'caisse'; }
function treasury(per){
  function inp(d){ return (per==='all'||!per)?true:inPer(d,per); }
  var t={ckIn:0,bkIn:0,ckOutDep:0,bkOutDep:0,ckOutAch:0,bkOutAch:0,ck2bk:0,bk2ck:0,ckOutFour:0,bkOutFour:0,ckInOwner:0,bkInOwner:0,ckOutOwner:0,bkOutOwner:0};
  S.payments.forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='banque') t.bkIn+=a; else t.ckIn+=a; });
  realExpenses().forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='banque') t.bkOutDep+=a; else t.ckOutDep+=a; });
  /* achats réglés comptant seulement (un achat à crédit ne sort pas de caisse tant qu'il n'est pas payé) */
  S.stock.forEach(function(x){ if(x.kind!=='entree'||isOpening(x)||x.paid===false||!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='banque') t.bkOutAch+=a; else t.ckOutAch+=a; });
  cashMoves().forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='caisse') t.ck2bk+=a; else t.bk2ck+=a; });
  /* paiements fournisseurs + apports/retraits du propriétaire */
  S.expenses.forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0;
    if(isSupplierPay(x)){ if(payMethod(x)==='banque') t.bkOutFour+=a; else t.ckOutFour+=a; }
    else if(x.category==='apport'){ if(payMethod(x)==='banque') t.bkInOwner+=a; else t.ckInOwner+=a; }
    else if(x.category==='retrait'){ if(payMethod(x)==='banque') t.bkOutOwner+=a; else t.ckOutOwner+=a; }
  });
  t.caisse = t.ckIn - t.ckOutDep - t.ckOutAch - t.ckOutFour - t.ck2bk + t.bk2ck + t.ckInOwner - t.ckOutOwner;
  t.banque = t.bkIn - t.bkOutDep - t.bkOutAch - t.bkOutFour - t.bk2ck + t.ck2bk + t.bkInOwner - t.bkOutOwner;
  t.total  = t.caisse + t.banque;
  t.inflow = t.ckIn + t.bkIn + t.ckInOwner + t.bkInOwner;
  t.outflow= t.ckOutDep + t.bkOutDep + t.ckOutAch + t.bkOutAch + t.ckOutFour + t.bkOutFour + t.ckOutOwner + t.bkOutOwner;
  t.net    = t.inflow - t.outflow;
  return t;
}

/* numéro de connexion normalisé (chiffres ; on retire l'indicatif 224) */

  return S.products.filter(function(p){return p.active!==false && p.category_id && ids.indexOf(p.category_id)>=0;});
}

  return tot;

function benefFor(period){
  function inP(d){ if(period==="all") return true; return String(d||"").slice(0,7)===today().slice(0,7); }
  function s(arr){ return arr.filter(function(x){return inP(x.date);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0); }
  var ventes=s(S.credits), depenses=expensesCharge(period==='all'?'all':'month');
  var achats=S.stock.filter(function(x){return x.kind==='entree'&&!isOpening(x)&&inP(x.date);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  return ventes-achats-depenses;
}
/* ---- period filtering (semaine / mois / trimestre / semestre / année / tout) ---- */
function _qtr(d){ return Math.floor((Number(d.slice(5,7))-1)/3); }
function _weekStart(d){ var dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; var day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); return dt.toISOString().slice(0,10); }
function inPer(dateStr,per){
  var d=String(dateStr||"").slice(0,10); if(!d) return false; if(per==="all") return true;
  var t=today();
  if(per==="week")     return _weekStart(d)===_weekStart(t);
  if(per==="month")    return d.slice(0,7)===t.slice(0,7);
  if(per==="quarter")  return d.slice(0,4)===t.slice(0,4) && _qtr(d)===_qtr(t);
  if(per==="semester") return d.slice(0,4)===t.slice(0,4) && (Number(d.slice(5,7))<=6)===(Number(t.slice(5,7))<=6);
  if(per==="year")     return d.slice(0,4)===t.slice(0,4);
  return true;
}
var PERIODS=[["week","Semaine"],["month","Mois"],["quarter","Trimestre"],["semester","Semestre"],["year","Année"],["all","Tout"]];
function perLabel(per){ var f=PERIODS.filter(function(p){return p[0]===per;})[0]; return f?f[1]:"Mois"; }
function periodBar(cur,attr){
  return '<div class="perbar">'+PERIODS.map(function(p){
    return '<button class="perchip'+(p[0]===cur?' on':'')+'" data-'+attr+'="'+p[0]+'">'+p[1]+'</button>';
  }).join('')+'</div>';
}
/* ---- stock aggregated to the 3 levels (value FG, weighted avg purchase price) ---- */
function stockLevels(){
  var m=stockByProduct(), route=0,cky=0,qRoute=0,qCky=0,triageKg=0,triageVal=0;
  Object.keys(m).forEach(function(pid){ var r=m[pid];
    cky+=r.ckyNet*r.avg; route+=r.routeNet*r.avg; qCky+=r.ckyNet; qRoute+=r.routeNet;
    triageKg+=r.triage; triageVal+=r.triage*r.avg; });
  return {route:route, cky:cky, total:route+cky, qRoute:qRoute, qCky:qCky, triageKg:triageKg, triageVal:triageVal};
}
/* ---- stock aggregated per category (kg + value) ---- */
function stockByCategory(){
  var m=stockByProduct(), out={};
  Object.keys(m).forEach(function(pid){ var p=prodById(pid); var c=p?prodCat(p):null; var key=c?c.id:'__nc'; var u=prodUnits(pid); var r=m[pid];
    if(!out[key]) out[key]={name:(c?c.name:"Sans catégorie"), su:u.su, qCky:0,qRoute:0,vCky:0,vRoute:0};
    var o=out[key]; o.qCky+=r.ckyNet; o.qRoute+=r.routeNet; o.vCky+=r.ckyNet*r.avg; o.vRoute+=r.routeNet*r.avg; });
  return out;
}

/* ===== STOCK EN KG (poids réel) ===== */
function prodContentOf(x){
  var c=(x&&x.content_per_unit!=null&&x.content_per_unit!=="")?Number(x.content_per_unit):null;
  if(!c){ var p=prodById(x&&x.product_id); c=(p&&p.content_per_unit!=null)?Number(p.content_per_unit):null; }
  return (c&&c>0)?c:1;
}
function entryKg(x){ if(x&&x.qty_kg!=null&&x.qty_kg!=="") return Number(x.qty_kg)||0; return (Number(x&&x.qty)||0)*prodContentOf(x); }
function prodUnits(pid){ var p=prodById(pid), c=p?prodCat(p):null; var content=(p&&p.content_per_unit!=null)?Number(p.content_per_unit):((c&&c.content_per_unit!=null)?Number(c.content_per_unit):1); return {su:(c?c.sale_unit:'unité'), ou:(c?c.order_unit:''), content:(content>0?content:1)}; }
function stkQty(kg,pid){ var u=prodUnits(pid); var txt=rnd(kg)+' '+esc(u.su); if(u.ou&&u.ou!==u.su&&u.content>1){ txt+=' <span style="color:var(--muted)">(≈ '+rnd(kg/u.content)+' '+esc(u.ou)+')</span>'; } return txt; }
/* m[pid] : tout en kg — cky/route (entrées), transfer (acheminé route→Conakry), sortie (ventes), triage (manques) */
function stockByProduct(){
  var m={};
  function ens(pid){ if(!m[pid]) m[pid]={cky:0,route:0,transfer:0,sortie:0,triage:0,sold:0,qtyIn:0,amtIn:0}; return m[pid]; }
  S.stock.forEach(function(x){ if(!x.product_id) return;
    var r=ens(x.product_id), kg=entryKg(x);
    if(x.kind==='transfert'){ r.transfer+=kg; }
    else if(x.kind==='sortie'){ if(x.reason==='triage') r.triage+=kg; else r.sortie+=kg; }
    else { var loc=(x.location==='route')?'route':'cky'; r[loc]+=kg; r.qtyIn+=kg; r.amtIn+=Number(x.amount)||0; }
  });
  // ventes (crédits) : le poids vendu sort automatiquement du stock Conakry
  S.credits.forEach(function(x){ if(!x.product_id) return; var kg=Number(x.content_qty)||0; if(kg>0) ens(x.product_id).sold+=kg; });
  // niveaux nets (kg)
  Object.keys(m).forEach(function(k){ var r=m[k];
    r.routeNet=Math.max(0, r.route - r.transfer);
    // Les manques / triages / cassées proviennent de sacs DÉJÀ vendus :
    // ils se déduisent des sacs vendus, PAS du stock présent à Conakry.
    r.ckyNet=Math.max(0, r.cky + r.transfer - r.sortie - r.sold);
    r.soldNet=Math.max(0, r.sold - r.triage); // poids réellement conservé par le client
    r.avg=r.qtyIn>0?r.amtIn/r.qtyIn:0; // coût moyen pondéré par kg
  });
  return m;
}

    var hint=document.getElementById("a_hint"); if(hint) hint.innerHTML="Disponible « non acheminé » : <b>"+av+" "+esc(u.ou||'sac')+"</b>"+(u.content>1?(" (soit "+rnd(av*u.content)+" "+esc(u.su)+")"):""); }
  if(sp) sp.addEventListener("change",sync);
  var qf=document.getElementById("a_qty"); if(qf) qf.addEventListener("input",function(){ var av=rnd(routeSacs(V("a_prod"))); if(Number(qf.value)>av) qf.value=av; });

/* Acheminement : on déplace les entrées « route » vers « Conakry » (colonne
   location). Ni nouveau type de mouvement, ni contrainte de base à modifier :
   le stock acheminé devient immédiatement disponible et valorisé à Conakry,
   et diminue d'autant le stock non acheminé. Les montants d'achat sont
   répartis au prorata quand on n'achemine qu'une partie d'un lot. */
async function saveAcheminement(){
  var pid=V("a_prod")||null; if(!pid){ toast("Choisissez un produit."); return; }
  var sacs=numOrNull("a_qty"); if(!sacs||sacs<=0){ toast("Indiquez le nombre de sacs."); return; }
  if(needsOnline()) return;
  var u=prodUnits(pid), availSacs=routeSacs(pid);
  if(sacs>availSacs+0.001){ toast("Vous ne pouvez pas acheminer plus que "+rnd(availSacs)+" "+(u.ou||'sac')+" disponible(s)."); return; }
  var content=(u.content>0?u.content:1), needKg=Math.round(sacs*content*1000)/1000, EPS=0.001, d=V("a_date")||today();
  var routeRows=S.stock.filter(function(x){return x.product_id===pid && x.kind==='entree' && x.location==='route';})
    .slice().sort(function(a,b){return (String(a.date||'').localeCompare(String(b.date||'')))||(String(a.created_at||'').localeCompare(String(b.created_at||'')));});
  var err=null, moved=0;
  for(var i=0;i<routeRows.length && needKg>EPS;i++){
    var x=routeRows[i], xKg=entryKg(x); if(xKg<=EPS) continue;
    if(xKg<=needKg+EPS){
      // le lot entier part à Conakry
      var r=await sb.from('stock_entries').update({location:'conakry'}).eq('id',x.id);
      if(r&&r.error){ err=r.error; break; }
      needKg=Math.round((needKg-xKg)*1000)/1000; moved++;
    } else {
      // acheminement partiel : on scinde le lot (reste en route + part à Conakry)
      var frac=needKg/xKg, movedKg=Math.round(needKg*1000)/1000, remKg=Math.round((xKg-needKg)*1000)/1000;
      var amt=Number(x.amount)||0, movedAmt=Math.round(amt*frac), remAmt=amt-movedAmt;
      var qty=(x.qty!=null&&x.qty!=="")?Number(x.qty):null, movedQty=(qty!=null)?Math.round(qty*frac*1000)/1000:null, remQty=(qty!=null)?Math.round((qty-movedQty)*1000)/1000:null;
      var r1=await sb.from('stock_entries').update({qty_kg:remKg, amount:remAmt, qty:remQty}).eq('id',x.id);
      if(r1&&r1.error){ err=r1.error; break; }
      var r2=await sb.from('stock_entries').insert({kind:'entree', location:'conakry', product_id:pid, label:(x.label||(prodById(pid)?prodById(pid).name:'Acheminement')), qty:movedQty, qty_kg:movedKg, unit:(x.unit||u.ou||'sac'), amount:movedAmt, content_per_unit:(x.content_per_unit!=null?x.content_per_unit:null), supplier:(x.supplier||null), date:(x.date||d), note:'acheminé vers Conakry'});
      if(r2&&r2.error){ err=r2.error; break; }
      needKg=0; moved++;
    }
  }
  if(err){ toast("Erreur acheminement : "+err.message); await refresh(); return; }
  if(!moved){ toast("Aucun stock « non acheminé » à acheminer."); return; }
  closeSheet(); toast("Acheminé vers Conakry ✓"); await refresh();
}

async function saveOrderAsSale(id){
  if(needsOnline()) return;
  var o=S.orders.find(function(x){return x.id===id;}); if(!o) return;
  var its=(o.items||[]).filter(function(it){return it&&(it.product_id||it.label||it.name);});
  var d=V("ots_date")||today(), done=0;
  for(var i=0;i<its.length;i++){

    var p=it.product_id?prodById(it.product_id):null, cat=p?prodCat(p):null;

      label:it.label||it.name||(p?p.name:"Vente"), amount:amt,
      qty:(it.qty!=null?it.qty:null),
      order_unit:(it.order_unit||(cat?cat.order_unit:null)),
      content_qty:(it.content_qty!=null?it.content_qty:null),
      sale_unit:(it.sale_unit||(cat?cat.sale_unit:null)), date:d};
    await saveOp({type:'credit', table:'credits', payload:payload});
    done++;
  }
  if(!done){ toast("Aucun montant valide."); return; }

  notifyClientPush(o.client_id, "Commande livrée", "Votre commande a été enregistrée et livrée. Merci !");
  offerWaNotify(id, 'livrée');
}

/* Push (automatique) : appel non bloquant de la fonction serveur « notify ».

}

/* ===== ANALYSE — graphiques 100% hors-ligne (SVG), lus sur les données existantes ===== */
/* Palette catégorielle validée (contrastée, lisible) pour le camembert */
var ANA_CAT=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#6250d6','#C0392B','#5B6B7A'];
function anaEmpty(msg){ return '<div class="item-empty" style="margin-top:2px">'+esc(msg||'Pas encore de données pour cette période.')+'</div>'; }
function trunc(s,n){ s=String(s==null?'':s); return s.length>n?s.slice(0,n-1)+'…':s; }
/* Montant compact en FG : 1 234 567 -> « 1,2 M FG » (pour les étiquettes de graphiques) */
function kFmt(n){ n=Number(n)||0; var neg=n<0?'-':'', a=Math.abs(n);
  if(a>=1e9) return neg+(a/1e9).toFixed(a>=1e10?0:1).replace('.',',').replace(',0','')+' Md FG';
  if(a>=1e6) return neg+(a/1e6).toFixed(a>=1e7?0:1).replace('.',',').replace(',0','')+' M FG';
  if(a>=1e3) return neg+Math.round(a/1e3)+' k FG';
  return neg+Math.round(a)+' FG'; }

/* Barres horizontales (une série = magnitude ; une seule teinte + étiquette de valeur) */
function svgBarsH(rows, opt){
  opt=opt||{}; rows=(rows||[]).filter(function(r){return (Number(r.value)||0)>0;});
  if(!rows.length) return anaEmpty(opt.empty);
  var max=Math.max.apply(null,rows.map(function(r){return Number(r.value)||0;}))||1;
  var barZone=186, gutter=118, w=barZone+gutter, rh=14, nameH=15, gap=16, rowH=nameH+rh+gap;
  var out='';
  rows.forEach(function(r,i){
    var v=Number(r.value)||0, bw=Math.max(3, v/max*barZone), col=r.color||opt.color||'var(--green)';
    var yy=i*rowH;
    out+='<text x="0" y="'+(yy+11)+'" style="font:700 12px Manrope;fill:var(--ink)">'+esc(trunc(r.label,30))+'</text>'
      +'<rect x="0" y="'+(yy+nameH)+'" rx="4" width="'+bw.toFixed(1)+'" height="'+rh+'" fill="'+col+'"></rect>'
      +'<text x="'+(bw+7).toFixed(1)+'" y="'+(yy+nameH+11)+'" style="font:700 11px Manrope;fill:var(--muted)">'+esc(kFmt(v))+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+(rows.length*rowH)+'" style="width:100%;height:auto;display:block" role="img" aria-label="Graphique en barres">'+out+'</svg>';
}

/* Courbes (jusqu'à 2 séries, même échelle FG) + points de fin ; légende HTML à part */
function svgLine(months, series){
  var w=320,h=158,pT=10,pB=20,pL=2,pR=6;
  var all=[]; series.forEach(function(s){ all=all.concat(s.vals); }); all.push(0);
  var max=Math.max.apply(null,all), min=Math.min.apply(null,all); if(max===min){ max=max+1; }
  var plotW=w-pL-pR, plotH=h-pT-pB, n=months.length;
  function X(i){ return pL+(n<=1?plotW/2:(i/(n-1))*plotW); }
  function Y(v){ return pT+(1-(v-min)/(max-min))*plotH; }
  var out='';
  if(min<0){ var zy=Y(0).toFixed(1); out+='<line x1="'+pL+'" y1="'+zy+'" x2="'+(w-pR)+'" y2="'+zy+'" stroke="var(--line)" stroke-width="1"/>'; }
  months.forEach(function(m,i){ if(n>7 && i%2!==0 && i!==n-1) return;
    out+='<text x="'+X(i).toFixed(1)+'" y="'+(h-5)+'" text-anchor="middle" style="font:600 9px Manrope;fill:var(--muted)">'+esc(m.label)+'</text>'; });
  series.forEach(function(s){
    var d=s.vals.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
    out+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    var li=s.vals.length-1; out+='<circle cx="'+X(li).toFixed(1)+'" cy="'+Y(s.vals[li]).toFixed(1)+'" r="3.5" fill="'+s.color+'"/>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block" role="img" aria-label="Courbes d\'évolution">'+out+'</svg>';
}

/* Camembert (part relative) ; légende HTML avec nom + montant + % */
function svgDonut(slices){
  var cx=70,cy=70,r=60,rin=35, ang=-Math.PI/2, out='';
  var tot=slices.reduce(function(a,s){return a+(Number(s.value)||0);},0);
  if(tot<=0) return '';
  slices.forEach(function(s,i){
    var frac=(Number(s.value)||0)/tot; if(frac<=0) return;
    var a2=ang+frac*2*Math.PI, large=frac>0.5?1:0;
    if(frac>=0.9999){ out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r+rin)/2)+'" fill="none" stroke="'+(s.color||ANA_CAT[i%ANA_CAT.length])+'" stroke-width="'+(r-rin)+'"/>'; ang=a2; return; }
    var x1=(cx+r*Math.cos(ang)).toFixed(2), y1=(cy+r*Math.sin(ang)).toFixed(2),
        x2=(cx+r*Math.cos(a2)).toFixed(2), y2=(cy+r*Math.sin(a2)).toFixed(2),
        xi1=(cx+rin*Math.cos(a2)).toFixed(2), yi1=(cy+rin*Math.sin(a2)).toFixed(2),
        xi2=(cx+rin*Math.cos(ang)).toFixed(2), yi2=(cy+rin*Math.sin(ang)).toFixed(2);
    out+='<path d="M'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' L'+xi1+' '+yi1+' A'+rin+' '+rin+' 0 '+large+' 0 '+xi2+' '+yi2+' Z" fill="'+(s.color||ANA_CAT[i%ANA_CAT.length])+'" stroke="var(--surface)" stroke-width="2"/>';
    ang=a2;
  });

}

/* Barres empilées horizontales (une seule ligne, segments = répartition) */
function svgStacked(segs, opt){
  opt=opt||{}; var tot=segs.reduce(function(a,s){return a+(Number(s.value)||0);},0);
  if(tot<=0) return anaEmpty(opt.empty);
  var w=320,hh=26,x=0,out='';
  segs.forEach(function(s){ var v=Number(s.value)||0; if(v<=0) return; var sw=v/tot*w; out+='<rect x="'+x.toFixed(1)+'" y="0" width="'+Math.max(0,sw-2).toFixed(1)+'" height="'+hh+'" rx="3" fill="'+s.color+'"/>'; x+=sw; });
  return '<svg viewBox="0 0 '+w+' '+hh+'" style="width:100%;height:auto;display:block" role="img" aria-label="Barre empilée">'+out+'</svg>';
}
function legendRow(items){ /* items:[{label,color,value?}] */

}
function anaCard(title,sub,body){

/* ---- 12 derniers mois (clés AAAA-MM + libellés courts FR) ---- */
function lastMonths(n){
  var ML=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  var out=[], base=new Date(); base.setDate(1);
  for(var i=n-1;i>=0;i--){ var d=new Date(base.getFullYear(), base.getMonth()-i, 1);
    out.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label:ML[d.getMonth()]}); }
  return out;
}

function renderAnalyse(){
  var h='<button class="add-link" data-go="menu" style="margin:2px 0 12px">‹ Gestion</button>';
  h+='<div class="view-title">Analyse</div><p class="view-sub">Vos opérations en graphiques. Tout est calculé sur votre téléphone, même sans connexion. Montants en FG.</p>';
  var per=anaPeriod, pl=perLabel(per).toLowerCase();

  /* ===== 1) Évolution CA & bénéfice — 12 derniers mois (toujours, indépendant de la période) ===== */
  var months=lastMonths(12);
  function monthSum(arr,key,filt){ return arr.reduce(function(a,x){ if(filt&&!filt(x)) return a; return a+(String(x.date||'').slice(0,7)===key?(Number(x.amount)||0):0); },0); }
  var caV=[], benV=[];
  months.forEach(function(m){
    var ca=monthSum(S.credits,m.key);
    var ach=monthSum(S.stock,m.key,function(x){return x.kind==='entree'&&!isOpening(x);});
    var dep=realExpenses().reduce(function(a,x){return a+expChargeOfMonth(x,m.key);},0);
    caV.push(ca); benV.push(ca-ach-dep);
  });
  var evoBody=svgLine(months,[{name:'CA',color:'var(--green)',vals:caV},{name:'Bénéfice',color:'var(--gold)',vals:benV}])
    +legendRow([{label:'Chiffre d\'affaires',color:'var(--green)'},{label:'Bénéfice',color:'var(--gold)'}]);
  h+=anaCard('Évolution sur 12 mois','Chiffre d\'affaires et bénéfice estimé, mois par mois.',evoBody);

  /* ===== 2) KPI de la période choisie ===== */
  h+='<div class="hint" style="margin:18px 0 8px;font-weight:700;color:var(--muted)">Analyser la période&nbsp;:</div>'+periodBar(per,'anaper');
  var caP =S.credits.filter(function(x){return inPer(x.date,per);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var encP=S.payments.filter(function(x){return inPer(x.date,per);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var depP=expensesCharge(per);
  var achP=S.stock.filter(function(x){return x.kind==='entree'&&!isOpening(x)&&inPer(x.date,per);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var benP=caP-achP-depP;
  h+='<div class="money-grid" style="margin-top:10px">'
    +'<div class="m"><div class="lab">CA · '+esc(pl)+'</div><div class="v tnum" style="color:var(--green)">'+kFmt(caP)+'</div></div>'
    +'<div class="m"><div class="lab">Bénéfice</div><div class="v tnum" style="color:'+(benP>=0?'var(--good)':'var(--crit)')+'">'+kFmt(benP)+'</div></div>'
    +'<div class="m"><div class="lab">Encaissé</div><div class="v tnum" style="color:var(--good)">'+kFmt(encP)+'</div></div></div>';

  /* ===== 3) Ventes par produit (période) ===== */
  var vp={}; S.credits.forEach(function(x){ if(!inPer(x.date,per)) return; var k=x.product_id||'__none'; vp[k]=(vp[k]||0)+(Number(x.amount)||0); });
  var vpRows=Object.keys(vp).map(function(k){ return {label:(k==='__none'?'Non attribué':(prodById(k)?prodById(k).name:'—')), value:vp[k]}; })
    .sort(function(a,b){return b.value-a.value;});
  var vpTop=vpRows.slice(0,8); var vpRest=vpRows.slice(8).reduce(function(a,r){return a+r.value;},0);
  if(vpRest>0) vpTop.push({label:'Autres',value:vpRest,color:'var(--neutral)'});
  h+=anaCard('Ventes par produit','Marchandises vendues (à crédit) sur la période.',svgBarsH(vpTop,{empty:'Aucune vente sur cette période.'}));

  /* ===== 4) Ventes par catégorie (période) — camembert ===== */
  var vc={}; S.credits.forEach(function(x){ if(!inPer(x.date,per)) return; var p=x.product_id?prodById(x.product_id):null; var c=p?prodCat(p):null; var key=c?c.id:'__nc'; if(!vc[key]) vc[key]={name:(c?c.name:'Sans catégorie'),value:0}; vc[key].value+=(Number(x.amount)||0); });
  var vcRows=Object.keys(vc).map(function(k){return vc[k];}).filter(function(r){return r.value>0;}).sort(function(a,b){return b.value-a.value;});
  var vcTop=vcRows.slice(0,7); var vcRest=vcRows.slice(7).reduce(function(a,r){return a+r.value;},0);
  if(vcRest>0) vcTop.push({name:'Autres',value:vcRest});
  var vcTotal=vcTop.reduce(function(a,r){return a+r.value;},0);
  var catBody;
  if(vcTotal<=0){ catBody=anaEmpty('Aucune vente sur cette période.'); }
  else{
    vcTop.forEach(function(r,i){ r.color=(r.name==='Autres'?'var(--neutral)':ANA_CAT[i%ANA_CAT.length]); });
    catBody='<div class="ana-donut">'+svgDonut(vcTop.map(function(r){return {value:r.value,color:r.color};}))

        return '<div class="ana-leg-i"><i style="background:'+r.color+'"></i><span>'+esc(trunc(r.name,22))+' <b class="tnum">'+kFmt(r.value)+' · '+pct+'%</b></span></div>'; }).join('')+'</div></div>';
  }
  h+=anaCard('Ventes par catégorie','Répartition du chiffre d\'affaires par interface/catégorie.',catBody);

  /* ===== 5) Meilleurs clients (période, par CA) ===== */
  var mc={}; S.credits.forEach(function(x){ if(!inPer(x.date,per)) return; if(!x.client_id) return; mc[x.client_id]=(mc[x.client_id]||0)+(Number(x.amount)||0); });

  h+=anaCard('Meilleurs clients','Clients ayant le plus acheté sur la période.',svgBarsH(mcRows,{empty:'Aucune vente sur cette période.'}));

  /* ===== 6) Soldes dus (situation actuelle, tous clients) ===== */
  var duRows=S.clients.map(function(c){ return {label:c.full_name||'Sans nom', value:totals(c.id).du}; })
    .filter(function(r){return r.value>0;}).sort(function(a,b){return b.value-a.value;}).slice(0,8);
  var duTot=S.clients.reduce(function(a,c){return a+totals(c.id).du;},0);
  h+=anaCard('Soldes dus','Montants restant à encaisser (situation du jour, tous clients). Total : '+money(duTot)+'.',svgBarsH(duRows,{color:'var(--crit)',empty:'Aucun solde dû. Tous les clients sont à jour ✓'}));

  /* ===== 7) Dépenses par poste (période) ===== */
  var dp={}; realExpenses().forEach(function(x){ var c=expCharge(x,per); if(c<=0) return; var k=catLabel(x.category); dp[k]=(dp[k]||0)+c; });
  var dpRows=Object.keys(dp).map(function(k){return {label:k,value:dp[k]};}).sort(function(a,b){return b.value-a.value;});
  h+=anaCard('Dépenses par poste','Salaires, loyer, transport… sur la période. Total : '+money(depP)+'.',svgBarsH(dpRows,{color:'var(--warn)',empty:'Aucune dépense sur cette période.'}));

  /* ===== 8) Trésorerie (situation) + encaissé vs crédit (période) ===== */
  var tz=treasury('all');
  var tzBody='<div class="money-grid">'
    +'<div class="m"><div class="lab">Caisse</div><div class="v tnum"'+(tz.caisse<0?' style="color:var(--crit)"':'')+'>'+kFmt(tz.caisse)+'</div></div>'
    +'<div class="m"><div class="lab">Banque</div><div class="v tnum"'+(tz.banque<0?' style="color:var(--crit)"':'')+'>'+kFmt(tz.banque)+'</div></div>'
    +'<div class="m"><div class="lab">Total</div><div class="v tnum">'+kFmt(tz.total)+'</div></div></div>';
  var recouvr = caP>0?Math.round(encP/caP*100):0;
  tzBody+='<div class="ana-sub" style="margin:14px 0 6px">Sur la période : encaissé vs ventes</div>'
    +svgBarsH([{label:'Ventes (crédit)',value:caP,color:'var(--gold)'},{label:'Encaissé (payé)',value:encP,color:'var(--good)'}],{empty:'Aucun mouvement sur cette période.'});
  if(caP>0) tzBody+='<div class="hint" style="margin-top:8px">Taux de recouvrement sur la période : <b>'+recouvr+'%</b> des ventes ont été encaissées.</div>';
  h+=anaCard('Trésorerie & encaissements','Soldes caisse/banque (situation du jour), puis encaissements de la période.',tzBody);

  /* ===== 9) État du stock (situation) ===== */
  var lv=stockLevels();
  var stkBody=svgStacked([{label:'Conakry',value:lv.cky,color:'var(--green)'},{label:'Non acheminé',value:lv.route,color:'var(--gold)'}],{empty:'Aucun stock valorisé pour le moment.'})
    +legendRow([{label:'À Conakry',color:'var(--green)',value:kFmt(lv.cky)},{label:'Acheté — non acheminé',color:'var(--gold)',value:kFmt(lv.route)}])
    +'<div class="info-row" style="margin-top:10px"><span class="k">Valeur totale du stock</span><b class="tnum">'+money(lv.total)+'</b></div>';
  if(lv.triageKg>0) stkBody+='<div class="info-row"><span class="k" style="color:var(--crit)">Manques / triages (sur ventes)</span><b class="tnum" style="color:var(--crit)">'+rnd(lv.triageKg)+' kg · '+money(lv.triageVal)+'</b></div>';
  h+=anaCard('État du stock','Valeur au prix d\'achat moyen, à Conakry et en route.',stkBody);

  h+='<div class="hint" style="margin-top:14px;line-height:1.6">Ces graphiques se mettent à jour automatiquement à chaque nouvelle saisie (ventes, paiements, dépenses, stock). « CA » = chiffre d\'affaires (ventes à crédit enregistrées). « Bénéfice » = ventes − achats de marchandise − dépenses.</div>';
  return h;
}

/* ===== SAUVEGARDE / EXPORT CSV ===== */
function csvDownload(name,rows){
  var sep=";", BOM="﻿";
  var csv=rows.map(function(r){ return r.map(function(v){ v=(v==null?"":String(v)); if(/[";\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }).join(sep); }).join("\r\n");
  var blob=new Blob([BOM+csv],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function runExport(what){
  if(what==="clients"){ var r=[["Nom","Téléphone","Ville","Crédit total","Payé","Solde dû"]]; S.clients.forEach(function(c){ var t=totals(c.id); r.push([c.full_name,c.phone,c.city,t.credit,t.paye,t.du]); }); csvDownload("clients.csv",r); }
  else if(what==="sales"){ var r=[["Date","Client","Désignation","Quantité","Unité","Montant"]]; S.credits.forEach(function(x){ r.push([x.date,clientName(x.client_id),x.label,x.qty,x.order_unit,x.amount]); }); csvDownload("ventes.csv",r); }
  else if(what==="payments"){ var r=[["Date","Client","Note","Montant"]]; S.payments.forEach(function(x){ r.push([x.date,clientName(x.client_id),x.note,x.amount]); }); csvDownload("paiements.csv",r); }
  else if(what==="expenses"){ var r=[["Date","Catégorie","Libellé","Montant"]]; S.expenses.forEach(function(x){ r.push([x.date,catLabel(x.category),x.label,x.amount]); }); csvDownload("depenses.csv",r); }
  else if(what==="stock"){ var r=[["Date","Type","Emplacement","Produit","Quantité","Unité","Contenance","Prix unitaire","Coût total","Fournisseur","Règlement"]]; S.stock.forEach(function(x){ r.push([x.date,x.kind,(x.kind==='entree'?(x.location==='route'?'En route':'Conakry'):''),x.label,x.qty,x.unit,x.content_per_unit,x.unit_price,x.amount,x.supplier,(x.kind==='entree'?payMethod(x):'')]); }); csvDownload("stock.csv",r); }
  else if(what==="clients_db"){
    var r=[["Nom","Téléphone","Ville","Interfaces","Dette antérieure","Ventes enregistrées","Crédit total","Payé","Solde dû","Note"]];
    S.clients.forEach(function(c){ var t=totals(c.id); var ifs=clientCatIds(c).map(catName).filter(function(n){return n&&n!=="—";}).join(" / ");
      r.push([c.full_name,c.phone,c.city,ifs,t.opening,t.sales,t.credit,t.paye,t.du,c.note]); });

  }

var MOISFR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function monthLabel(key){ var p=String(key||"").split('-'); return p.length===2?(MOISFR[Number(p[1])-1]+' '+p[0]):key; }
function recentMonths(n){ var out=[], d=new Date(); d.setDate(1); for(var i=0;i<n;i++){ var dd=new Date(d.getFullYear(), d.getMonth()-i, 1); out.push(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')); } return out; }
function acctMonth(key){
  function inM(d){ return String(d||"").slice(0,7)===key; }
  function S_(arr,f){ return arr.filter(f).reduce(function(a,x){return a+(Number(x.amount)||0);},0); }
  var ventes   = S_(S.credits, function(x){return inM(x.date);});
  var encaisse = S_(S.payments, function(x){return inM(x.date);});
  var achats   = S_(S.stock, function(x){return x.kind==='entree'&&!isOpening(x)&&inM(x.date);});
  var achatsCr = S_(S.stock, function(x){return x.kind==='entree'&&!isOpening(x)&&x.paid===false&&inM(x.date);});
  var charges  = realExpenses().reduce(function(a,x){return a+expChargeOfMonth(x,key);},0);
  var payFour  = S_(S.expenses, function(x){return isSupplierPay(x)&&inM(x.date);});
  var apport   = S_(S.expenses, function(x){return x.category==='apport'&&inM(x.date);});
  var retrait  = S_(S.expenses, function(x){return x.category==='retrait'&&inM(x.date);});
  return {ventes:ventes, encaisse:encaisse, achats:achats, achatsCr:achatsCr, charges:charges, payFour:payFour, apport:apport, retrait:retrait, benef:ventes-achats-charges};
}

function weeklyTreasury(per){
  function inp(d){ return (per==='all'||!per)?true:inPer(d,per); }
  var wk={};
  function ens(d){ var w=_weekStart(String(d||"").slice(0,10)); if(!wk[w]) wk[w]={w:w, ckIn:0,bkIn:0,ckOut:0,bkOut:0}; return wk[w]; }
  S.payments.forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; var e=ens(x.date); if(payMethod(x)==='banque') e.bkIn+=a; else e.ckIn+=a; });
  realExpenses().forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; var e=ens(x.date); if(payMethod(x)==='banque') e.bkOut+=a; else e.ckOut+=a; });
  S.stock.forEach(function(x){ if(x.kind!=='entree'||isOpening(x)||!inp(x.date))return; var a=Number(x.amount)||0; var e=ens(x.date); if(payMethod(x)==='banque') e.bkOut+=a; else e.ckOut+=a; });
  cashMoves().forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; var e=ens(x.date); if(payMethod(x)==='caisse'){ e.ckOut+=a; e.bkIn+=a; } else { e.bkOut+=a; e.ckIn+=a; } });
  return Object.keys(wk).map(function(k){return wk[k];}).sort(function(a,b){return b.w.localeCompare(a.w);});
}

/* ===== RÉCOMPENSES ===== */
function curYear(){ return String(new Date().getFullYear()); }
function clientProductQty(clientId, productId){
  return S.credits.filter(function(x){return x.client_id===clientId && x.product_id===productId && String(x.date||"").slice(0,4)===curYear();})
    .reduce(function(a,x){return a+(Number(x.qty)||0);},0);
}
/* nombre de cadeaux déjà remis à un client pour une règle, cette année */
function giftsRemis(clientId, ruleId){
  return S.redemptions.filter(function(x){return x.client_id===clientId && x.rule_id===ruleId && String(x.date||"").slice(0,4)===curYear();})
    .reduce(function(a,x){return a+(Number(x.qty)||1);},0);
}
/* règles applicables à un client = selon les catégories (interfaces) du client */
function rulesForClient(c){
  var rules=S.rules.filter(function(r){return r.active!==false;});
  var ids=(c&&Array.isArray(c.category_ids))?c.category_ids:[];
  if(!ids.length) return rules;
  return rules.filter(function(r){ var p=prodById(r.product_id); return p && p.category_id && ids.indexOf(p.category_id)>=0; });
}
/* liste des règles visibles dans l'écran « Récompenses » (filtrée pour l'assistant) */
function visibleRules(){
  var rules=S.rules.filter(function(r){return r.active!==false;});
  if(isAdmin()) return rules;
  var mine=(ME&&Array.isArray(ME.category_ids))?ME.category_ids:[];
  if(!mine.length) return rules;
  return rules.filter(function(r){ var p=prodById(r.product_id); return p && p.category_id && mine.indexOf(p.category_id)>=0; });
}
function rewardsCard(clientId){
  var c=S.clients.find(function(x){return x.id===clientId;});

async function saveGiftExpense(clientId, ruleId){
  if(needsOnline()) return;
  var r=S.rules.find(function(x){return x.id===ruleId;}); if(!r){ toast("Règle introuvable."); return; }
  var qty=Math.max(1, Math.round(Number(V("g_qty"))||1));
  var gagnes=Math.floor(clientProductQty(clientId,r.product_id)/(Number(r.threshold_qty)||1));
  var attente=Math.max(0, gagnes-giftsRemis(clientId,ruleId));
  if(qty>attente){ toast("Ce client n'a que "+attente+" cadeau(x) à remettre."); return; }
  var unitVal=Number(V("g_amount"))||0;
  var p=prodById(r.product_id), c=S.clients.find(function(x){return x.id===clientId;}), d=V("g_date")||today();
  // 1) enregistrer la remise (suivi remis / en attente, visible côté client)

  if(rr.error){ toast("Erreur : "+rr.error.message); return; }
  // 2) enregistrer la dépense correspondante (si une valeur est indiquée)

    await sb.from('expenses').insert({category:'recompense_client', label:'Cadeau fidélité'+(r.gift_label?(' : '+r.gift_label):''), amount:unitVal*qty, date:d, method:'caisse',
      note:'Client : '+(c?c.full_name:'')+(p?(' · Produit : '+p.name):'')+' · '+qty+' cadeau(x)'});

}

function inYear(d,y){ return String(d||"").slice(0,4)===String(y); }
function yearsPresent(){
  var set={}; [S.credits,S.payments,S.expenses,S.stock].forEach(function(arr){ arr.forEach(function(x){ var y=String(x.date||"").slice(0,4); if(y&&y.length===4) set[y]=true; }); });
  set[curYear()]=true;
  return Object.keys(set).sort().reverse();
}
function exerciceData(y){
  var ventes=S.credits.filter(function(x){return inYear(x.date,y);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var encaisse=S.payments.filter(function(x){return inYear(x.date,y);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var achats=S.stock.filter(function(x){return x.kind==='entree'&&!isOpening(x)&&inYear(x.date,y);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var exps=realExpenses().filter(function(x){return inYear(x.date,y);});
  var depenses=exps.reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var byCat={}; exps.forEach(function(x){ var k=x.category||'autre'; byCat[k]=(byCat[k]||0)+(Number(x.amount)||0); });
  return {ventes:ventes, encaisse:encaisse, achats:achats, depenses:depenses, benef:ventes-achats-depenses, byCat:byCat};
}

async function cloturerExercice(y){
  if(!isAdmin()){ toast("Réservé au gérant principal."); return; }
  if(needsOnline()) return;
  var nextY=String(Number(y)+1);
  var e=exerciceData(y);
  openSheet('<h3>Clôturer l\'exercice '+esc(y)+' ?</h3>'
    +'<p style="color:var(--muted);font-size:14px;margin:0 0 10px">Cette opération :</p>'
    +'<ul style="color:var(--muted);font-size:14px;margin:0 0 12px;padding-left:18px;line-height:1.7">'
    +'<li>enregistre une <b>sauvegarde complète</b> ;</li>'
    +'<li>reporte le <b>solde dû</b> de chaque client en <b>dette antérieure '+esc(nextY)+'</b> ;</li>'
    +'<li>efface les <b>ventes, paiements et livraisons</b> (le stock et les dépenses sont conservés) ;</li>'
    +'<li>remet les compteurs de récompenses à zéro.</li></ul>'
    +'<div class="hint" style="margin:0 0 12px;line-height:1.6;color:var(--crit)">Action irréversible. Assurez-vous d\'avoir téléchargé le rapport et l\'export de l\'exercice '+esc(y)+'.</div>'
    +'<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="cl_ok"><span>J\'ai conservé le rapport et je confirme la clôture.</span></label>'
    +'<div class="sheet-actions"><button class="btn btn-ghost" data-cancel="1">Annuler</button><button class="btn btn-danger" id="confCloture">Clôturer</button></div>');
  document.getElementById("confCloture").addEventListener("click",async function(){
    if(!document.getElementById("cl_ok").checked){ toast("Cochez la confirmation."); return; }
    closeSheet(); toast("Sauvegarde et clôture en cours…");
    // 1) sauvegarde complète
    var snap={clients:S.clients,products:S.products,orders:S.orders,deliveries:S.deliveries,credits:S.credits,payments:S.payments,categories:S.categories,stock:S.stock,expenses:S.expenses,rules:S.rules,redemptions:S.redemptions,at:new Date().toISOString(),exercice:y};
    var bk=await sb.from('backups').insert({data:snap, note:'Clôture exercice '+y});
    if(bk.error){ toast("Clôture annulée : la sauvegarde a échoué ("+bk.error.message+")."); return; }
    // 2) report du solde dû -> dette antérieure (calculé AVANT suppression)
    var ups=S.clients.map(function(c){ var du=Math.max(0, totals(c.id).du); return sb.from('profiles').update({opening_debt:du}).eq('id',c.id); });
    var ru=await Promise.all(ups); var badU=ru.find(function(x){return x.error;});
    if(badU){ toast("Erreur (report soldes) : "+badU.error.message); return; }
    // 3) effacer ventes / paiements / livraisons + récompenses remises
    var dels=[ sb.from('credits').delete().not('id','is',null), sb.from('payments').delete().not('id','is',null), sb.from('deliveries').delete().not('id','is',null) ];
    try{ dels.push(sb.from('gift_redemptions').delete().not('id','is',null)); }catch(e3){}
    var rd=await Promise.all(dels); var badD=rd.find(function(x){return x.error;});
    if(badD){ toast("Erreur (effacement) : "+badD.error.message); return; }
    exYear=nextY; toast("Exercice "+y+" clôturé ✓ — soldes reportés en "+nextY); await refresh();
  });
}

function personByUid(uid){ return S.people.find(function(p){return p.auth_user_id===uid;}); }

function allOps(){
  var ops=[];
  S.deliveries.forEach(function(x){ ops.push({t:"Livraison", when:x.created_at||x.date, by:x.created_by, who:clientName(x.client_id), label:x.label, amount:null, color:'var(--ink)'}); });
  S.credits.forEach(function(x){ ops.push({t:"Marchandise à crédit", when:x.created_at||x.date, by:x.created_by, who:clientName(x.client_id), label:x.label, amount:x.amount, color:'var(--crit)'}); });
  S.payments.forEach(function(x){ ops.push({t:"Paiement", when:x.created_at||x.date, by:x.created_by, who:clientName(x.client_id), label:x.note, amount:x.amount, color:'var(--good)'}); });
  S.stock.forEach(function(x){ ops.push({t:(x.kind==='sortie'?"Sortie de stock":"Entrée de stock"), when:x.created_at||x.date, by:x.created_by, who:x.label, label:'', amount:x.amount, color:'var(--ink)'}); });
  S.expenses.forEach(function(x){ ops.push({t:"Dépense", when:x.created_at||x.date, by:x.created_by, who:catLabel(x.category), label:x.label, amount:x.amount, color:'var(--crit)'}); });
  S.clients.forEach(function(c){ if(c.created_by) ops.push({t:"Nouveau client", when:c.created_at, by:c.created_by, who:c.full_name, label:'', amount:null, color:'var(--green)'}); });

function onEntryProd(){

  if(us) us.textContent=cat?cat.sale_unit:"unité";
  if(us2) us2.textContent=cat?cat.sale_unit:"kg";

  var priceEl=document.getElementById("e_price"); if(p&&priceEl&&!priceEl.value&&p.price!=null) priceEl.value=p.price;

function updateAmount(){
  var sel=document.getElementById("e_prod"); if(!sel||sel.getAttribute("data-type")!=="credit") return;
  var p=prodById(sel.value), cat=p?prodCat(p):null, su=cat?cat.sale_unit:"unité";
  var hint=document.getElementById("e_priceHint");
  var content=Number((document.getElementById("e_content")||{}).value)||0;
  var triage=Number((document.getElementById("e_triage")||{}).value)||0;
  var price=Number((document.getElementById("e_price")||{}).value)||0;
  var net=Math.max(0, content-triage); // poids réellement facturé = sac − triage/mélange
  var amtEl=document.getElementById("e_amount");
  if(price>0 && content>0){
    if(amtEl) amtEl.value=Math.round(price*net);
    if(hint){
      if(triage>0) hint.innerHTML='Montant = '+money(price)+' / '+esc(su)+' × ('+rnd(content)+' − '+rnd(triage)+' triage) = '+money(price)+' × '+rnd(net)+' '+esc(su)+' = <b>'+money(price*net)+'</b>.';

async function resetClientOps(id){
  if(!isAdmin()){ toast("Réservé au gérant principal."); return; }
  if(needsOnline()) return;
  var c=S.clients.find(function(x){return x.id===id;}); if(!c) return;
  var t=totals(id);
  openSheet('<h3>Réinitialiser ce client ?</h3>'
    +'<p style="color:var(--muted);font-size:14px;margin:0 0 12px">Les <b>livraisons</b>, <b>marchandises à crédit</b> et <b>paiements</b> de '+esc(c.full_name||"ce client")+' seront effacés, pour repartir à zéro (nouvelle année, nouveau carnet). Le client est conservé. Une sauvegarde est enregistrée avant.</p>'
    +'<label class="chk" style="margin-bottom:10px"><input type="checkbox" id="rz_carry" checked><span>Reporter le solde dû ('+money(t.du)+') en dette antérieure</span></label>'
    +'<div class="hint" style="margin:-2px 0 12px">Ainsi ce qu\'il reste à payer n\'est pas perdu : il devient le point de départ du nouveau carnet.</div>'
    +'<div class="sheet-actions"><button class="btn btn-ghost" data-cancel="1">Annuler</button><button class="btn btn-danger" id="confReset">Réinitialiser</button></div>');
  document.getElementById("confReset").addEventListener("click",async function(){
    var carry=document.getElementById("rz_carry")?document.getElementById("rz_carry").checked:true;

    // 1) sauvegarde des données du client
    var snap={client:c, deliveries:by(S.deliveries,id), credits:by(S.credits,id), payments:by(S.payments,id), orders:by(S.orders,id), reset_at:new Date().toISOString()};
    var bk=await sb.from('backups').insert({data:snap, note:'Réinitialisation client : '+(c.full_name||id)});
    if(bk.error){ toast("Réinitialisation annulée : la sauvegarde a échoué ("+bk.error.message+")."); return; }
    // 2) report éventuel du solde dû en dette antérieure
    if(carry){ var newOpening=Math.max(0, t.du); var ru=await sb.from('profiles').update({opening_debt:newOpening}).eq('id',id); if(ru.error){ toast("Erreur (report dette) : "+ru.error.message); return; } }
    // 3) suppression des opérations
    var steps=[ sb.from('deliveries').delete().eq('client_id',id), sb.from('credits').delete().eq('client_id',id), sb.from('payments').delete().eq('client_id',id), sb.from('orders').delete().eq('client_id',id) ];
    var rs=await Promise.all(steps); var bad=rs.find(function(x){return x.error;});
    if(bad){ toast("Erreur : "+bad.error.message); return; }
    toast("Client réinitialisé ✓"); await refresh();
  });
}

async function saveEntry(type,clientId){
  var d=V("e_date")||today();
  if(type==="deliv"){
    var pid=V("e_prod")||null, p=pid?prodById(pid):null, cat=p?prodCat(p):null;
    var payload={client_id:clientId, product_id:pid,
      label:V("e_label")||(p?p.name:"Livraison"), qty:numOrNull("e_qty"),
      order_unit:cat?cat.order_unit:null, content_qty:numOrNull("e_content"),
      sale_unit:cat?cat.sale_unit:null, date:d};
    var rd=await saveOp({type:'deliv', table:'deliveries', payload:payload});
    await saveTriageFromSale(pid, cat, d);
    finishEntry(rd);
  } else if(type==="credit"){
    var pid2=V("e_prod")||null, p2=pid2?prodById(pid2):null, cat2=p2?prodCat(p2):null;
    var a=Number(V("e_amount"))||0; if(a<=0){ toast("Indiquez un montant."); return; }
    var payload2={client_id:clientId, product_id:pid2,
      label:V("e_label")||(p2?p2.name:"Crédit"), amount:a, qty:numOrNull("e_qty"),
      order_unit:cat2?cat2.order_unit:null, content_qty:numOrNull("e_content"),
      sale_unit:cat2?cat2.sale_unit:null, date:d};
    var rc=await saveOp({type:'credit', table:'credits', payload:payload2});
    await saveTriageFromSale(pid2, cat2, d);
    finishEntry(rc);
  } else {
    var m=Number(V("e_amount"))||0; if(m<=0){ toast("Indiquez un montant."); return; }
    finishEntry(await saveOp({type:'payment', table:'payments', payload:{client_id:clientId,amount:m,note:V("e_note"),date:d,product_id:V("e_payprod")||null,method:V("e_method")||'caisse'}}));
    notifyClientPush(clientId, "Paiement reçu", "Votre paiement de "+money(m)+" a été enregistré. Merci !");
  }
}

async function delCat(id){
  if(needsOnline()) return;
  var res=await sb.from('categories').delete().eq('id',id);
  if(res.error){ toast("Erreur : "+res.error.message); return; }
  closeSheet(); toast("Interface supprimée"); await refresh();
}
async function saveStatus(id){
  if(needsOnline()) return;
  var st=V("o_status"); var o0=S.orders.find(function(x){return x.id===id;}); var prev=o0?o0.status:null;
  var res=await sb.from('orders').update({status:st}).eq('id',id);
  if(res.error){ toast("Erreur : "+res.error.message); return; }
  closeSheet(); toast("Statut mis à jour"); await refresh();
  if(st!==prev && (st==='validée'||st==='livrée')){
    notifyClientPush(id?(o0?o0.client_id:null):null, st==='livrée'?"Commande livrée":"Commande validée", st==='livrée'?"Votre commande a été livrée. Merci !":"Votre commande a été validée, nous la préparons.");
    offerWaNotify(id, st);
  }
}

/* ===== AUTH / BOOT ===== */
function showLogin(msg){ document.getElementById("bootView").hidden=true; document.getElementById("appView").hidden=true; document.getElementById("loginView").hidden=false; var e=document.getElementById("loginErr"); if(msg){ e.textContent=msg; e.hidden=false; } }
async function enterApp(){
  document.getElementById("loginView").hidden=true;
  document.getElementById("bootView").hidden=false;
  var sess=(await sb.auth.getSession()).data.session;
  NET.uid=sess?sess.user.id:null;
  var okBoot=false;
  if(navigator.onLine){
    try{
      var pr = await sb.from('profiles').select('*').eq('auth_user_id', (await sb.auth.getUser()).data.user.id).maybeSingle();
      if(pr.error) throw pr.error;
      if(!pr.data || (pr.data.role!=='admin' && pr.data.role!=='assistant')){
        await sb.auth.signOut(); document.getElementById("bootView").hidden=true; showLogin("Ce compte n'a pas accès à l'espace gérant."); return;
      }
      ME=pr.data; ROLE=pr.data.role; cacheMe();
      await loadAll();
      okBoot=true;
    }catch(e){
      if(NET.uid){ var me=cachedMe(NET.uid); if(me){ ME=me; ROLE=me.role; restoreSnap(NET.uid); applyPendingToState(); okBoot=true; } }
      if(!okBoot){ document.getElementById("bootView").hidden=true; showLogin("Impossible de charger les données. Vérifiez votre connexion."); return; }
    }
  } else {
    var me2=NET.uid?cachedMe(NET.uid):null;
    if(me2){ ME=me2; ROLE=me2.role; restoreSnap(NET.uid); applyPendingToState(); okBoot=true; }
    if(!okBoot){ document.getElementById("bootView").hidden=true; showLogin("Vous êtes hors ligne. Connectez-vous une première fois avec Internet pour activer le mode hors ligne."); return; }
  }
  document.getElementById("roleBadge").textContent = ROLE==='admin'?'Gérant':'Assistant';
  document.getElementById("bootView").hidden=true;
  document.getElementById("appView").hidden=false;
  if(LOCK.pendingSecret){ await storeLock(LOCK.pendingSecret); LOCK.pendingSecret=null; }
  armIdle(); setTimeout(offerBio, 1200); if(navigator.onLine) refreshPush();
  render(); renderSyncBar(); syncQueue();
  setTimeout(maybeAutoBackup, 3000);
}
document.getElementById("loginForm").addEventListener("submit",async function(e){
  e.preventDefault();
  var btn=document.getElementById("loginBtn"); btn.disabled=true; btn.textContent="Connexion…";
  document.getElementById("loginErr").hidden=true;
  var pwd=V("lp");
  var res=await sb.auth.signInWithPassword({ email:V("le"), password:pwd });
  btn.disabled=false; btn.textContent="Se connecter";
  if(res.error){ document.getElementById("loginErr").textContent="E-mail ou mot de passe incorrect."; document.getElementById("loginErr").hidden=false; return; }
  LOCK.pendingSecret=pwd;
  enterApp();
});
document.getElementById("logoutBtn").addEventListener("click",async function(){ disarmIdle(); await sb.auth.signOut(); location.reload(); });

(async function(){
  var s=await sb.auth.getSession();
  if(s.data.session) enterApp(); else showLogin();
})();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/service-worker.js').catch(function(){}); }
</script>
