<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Espace Gérant — Bouliedou</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest-gerant.json">
<meta name="theme-color" content="#0C4A39">
<link rel="apple-touch-icon" href="/bgb-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BGB Gérant">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0C4A39; --green-deep:#06382C; --gold:#C2993F; --gold-soft:#D8B65F;
  --bg:#F4F1E7; --surface:#FFFFFF; --surface-2:#FAF7EE; --line:#E7E1CF;
  --ink:#1B2821; --muted:#6B7A70; --ink-soft:#3A4A41;
  --good:#1F8F5F; --good-bg:#E4F2EA; --warn:#B07D18; --warn-bg:#F7ECD2;
  --crit:#C0392B; --crit-bg:#F7E3E0; --neutral:#5B6B7A; --neutral-bg:#E8ECF0;
  --shadow:0 1px 2px rgba(12,44,44,.05),0 10px 26px -16px rgba(12,44,44,.35);
  --sheet-shadow:0 -8px 40px -12px rgba(12,44,44,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,.mont{font-family:"Montserrat",sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* login */
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px 24px;width:100%;max-width:400px}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.login-logo svg,.login-logo img{width:62px;height:auto}
.login-logo b{font-family:"Montserrat";font-weight:800;color:var(--green);font-size:18px;letter-spacing:.3px}
.login-logo span{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.login h1{font-size:19px;text-align:center;margin:0 0 4px}
.login p.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 20px}

/* header */
.app-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--green-deep);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg,.brand img{width:32px;height:auto;flex:none}
.app-head .brand svg{--mk-stroke:#F5EFDE;--mk-gold:#D8B65F}
.brand .t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand .t b{font-family:"Montserrat";font-weight:800;font-size:15px}
.brand .t span{font-size:10px;color:var(--gold-soft);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.role-badge{font-size:10px;font-weight:700;background:var(--gold);color:#201604;border-radius:999px;padding:3px 9px;text-transform:uppercase;letter-spacing:.04em}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.head-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:700}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 96px}
.view-title{font-family:"Montserrat",sans-serif;font-weight:800;font-size:23px;letter-spacing:-.015em;margin:2px 0 2px}
.view-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

.home-hi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:2px 0 14px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.dash-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow);text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .08s ease}
.dash-card:active{transform:scale(.98)}
.dash-card.wide{grid-column:1 / -1}
.dc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.dc-lab{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);line-height:1.25}
.dc-chev{color:var(--green);font-size:18px;font-weight:800;flex:none;line-height:1;margin-top:-1px}
.dc-val{font-family:"Montserrat";font-weight:800;font-size:16px;margin-top:3px;line-height:1.2;white-space:normal;overflow-wrap:normal}
.dash-card.wide .dc-val{font-size:20px}
.dc-sub{font-size:10.5px;color:var(--muted);line-height:1.3}
.hi-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);cursor:pointer;font:inherit}
.hi-card .hi-l{font-size:12px;font-weight:700;color:var(--muted)}
.hi-card .hi-v{font-family:"Montserrat";font-weight:800;font-size:21px;margin-top:6px;letter-spacing:-.01em}
.hi-card .hi-s{font-size:11px;color:var(--muted);margin-top:2px}
@media (max-width:420px){.hi-card .hi-v{font-size:19px}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .lab i{width:9px;height:9px;border-radius:50%}
.kpi .val{font-family:"Montserrat";font-weight:800;font-size:22px;margin-top:8px;letter-spacing:-.01em}
.kpi .val.sm{font-size:18px}

.section-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.section-h h2{font-size:15px;font-weight:800;margin:0}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--gold)}

.clist{display:flex;flex-direction:column;gap:10px}
.c-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;text-align:left;width:100%;color:inherit}
.c-av{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Montserrat";font-weight:800;color:var(--green);flex:none}
.c-main{flex:1;min-width:0}
.c-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.solde{font-size:12.5px;font-weight:800;color:var(--crit);white-space:nowrap;flex:none}
.solde.ok{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;font-weight:700;font-size:14.5px;padding:12px 18px}
.btn-green{background:var(--green);color:#fff}
.btn-gold{background:var(--gold);color:#201604}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-danger{background:var(--crit-bg);color:var(--crit)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.tabbar{position:sticky;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--muted);border-radius:12px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:700}
.tab.on{color:var(--green)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:800}
.add-link{background:none;border:0;color:var(--green);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.add-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}

.d-head{position:relative;overflow:hidden;background:linear-gradient(158deg,var(--green) 0%,var(--green-deep) 58%,#042A20 100%);color:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.d-head::after{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(216,182,95,.20),transparent 70%);pointer-events:none}
.d-head>*{position:relative}
.d-head .av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-family:"Montserrat";font-weight:800;font-size:20px;margin-bottom:10px}
.d-head h2{margin:0;font-size:20px}
.d-head .t{color:var(--gold-soft);font-size:13px;font-weight:600;margin-top:3px}
.d-actions{display:flex;gap:9px;margin:14px 0 2px;flex-wrap:wrap}
.d-actions .btn{flex:1;padding:11px;min-width:120px}
.info-row{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-row .k{color:var(--muted);min-width:72px;font-size:12.5px;font-weight:600;text-transform:uppercase}
.money-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.money-grid .m{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.money-grid .m .lab{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.money-grid .m .v{font-family:"Montserrat";font-weight:800;font-size:15px;margin-top:4px}
.money-grid .m.due .v{color:var(--crit)} .money-grid .m.due.ok .v{color:var(--good)}
.ana-sub{font-size:12px;color:var(--muted);margin:-2px 0 12px;line-height:1.5}
.ana-leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
.ana-leg.col{display:flex;flex-direction:column;gap:7px;margin-top:0;min-width:0;flex:1 1 auto}
.ana-leg-i{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--ink);line-height:1.35;min-width:0}
.ana-leg-i i{width:11px;height:11px;border-radius:3px;flex:none;margin-top:2px}
.ana-leg-i b{font-weight:800}
.ana-donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .top{display:flex;justify-content:space-between;gap:10px}
.item .lab{font-weight:600;font-size:14px}
.item .amt{font-weight:800;font-size:14px;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:1px}
.item .del{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;flex:none}
.item-empty{color:var(--muted);font-size:13px;text-align:center;padding:12px 0}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.nouvelle{background:var(--warn-bg);color:var(--warn)} .pill.validée{background:var(--neutral-bg);color:var(--neutral)}
.pill.livrée{background:var(--good-bg);color:var(--good)} .pill.annulée{background:var(--line);color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;box-shadow:var(--sheet-shadow);max-height:92vh;overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 10px}
.sheet h3{margin:4px 0 16px;font-size:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field textarea{min-height:64px;resize:vertical}
.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--green);flex:none}
.chk small{color:var(--muted);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.pbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft))}
.sheet-actions{display:flex;gap:10px;margin-top:8px}.sheet-actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:var(--crit-bg);color:var(--crit);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.netbar{display:none;padding:8px 14px;font-size:12.5px;font-weight:700;text-align:center;flex:none}
.netbar.show{display:block}
.netbar.off{background:var(--warn-bg);color:var(--warn)}
.netbar.sync{background:var(--neutral-bg);color:var(--neutral)}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.lockscreen{position:fixed;inset:0;z-index:9999;background:var(--green-deep);display:flex;align-items:center;justify-content:center;padding:24px}
.lock-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:30px 24px;width:100%;max-width:380px;text-align:center}
.lock-ic{font-size:38px;line-height:1;margin-bottom:8px}
.lock-card h2{margin:0 0 6px;font-size:20px}
.lock-card p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.5}
.lock-logout{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;margin-top:14px;text-decoration:underline}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* period filter chips */
.perbar{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;scrollbar-width:none}
.perbar::-webkit-scrollbar{display:none}
.perchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.perchip.on{background:var(--green);color:#fff;border-color:var(--green)}
/* stock synthesis card */
.stock-syn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);cursor:pointer;font:inherit;margin-top:12px}
.stock-syn .ss-h{display:flex;justify-content:space-between;align-items:baseline;font-family:"Montserrat";font-weight:800;font-size:15px;color:var(--ink);margin-bottom:8px}
.stock-syn .ss-h b{font-size:18px}
.stock-syn .ss-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13.5px;color:var(--muted)}
.stock-syn .ss-row span{display:flex;align-items:center;gap:8px}
.stock-syn .ss-row i{width:9px;height:9px;border-radius:50%;display:inline-block}
.stock-syn .ss-row b{color:var(--ink);font-weight:700}
.stock-syn .ss-row.tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:9px;color:var(--ink);font-weight:800}
.stock-syn .ss-s{font-size:11px;color:var(--muted);margin-top:8px}
/* category rollup */
.catroll .cr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.catroll .cr:last-child{border-bottom:0}
.catroll .cr .nm{font-weight:700}
.catroll .cr .q{font-size:12px;color:var(--muted);margin-top:2px}
/* assistant : pas de suppression */
.role-assistant .del,.role-assistant .btn-danger{display:none!important}

/* ===================== ACCUEIL — refonte premium ===================== */
.greet{margin:2px 0 14px}
.greet .g-hi{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 1px}
.greet .g-t{font-family:"Montserrat";font-weight:800;font-size:23px;margin:0;letter-spacing:-.015em}
.hero{position:relative;background:linear-gradient(158deg,var(--green) 0%,var(--green-deep) 58%,#042A20 100%);color:#fff;border-radius:20px;padding:17px 18px 15px;box-shadow:var(--shadow);overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(216,182,95,.20),transparent 70%);pointer-events:none}
.hero-lab{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.hero-eye{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.hero-eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero-val{font-family:"Montserrat";font-weight:800;font-size:32px;line-height:1.08;margin:9px 0 2px;letter-spacing:-.025em}
.hero-val small{font-size:14px;font-weight:700;opacity:.8}
.hero-rule{height:1px;background:rgba(255,255,255,.16);margin:12px 0}
.hero-split{display:flex;align-items:stretch}
.hero-cell{flex:1;min-width:0}
.hero-cell + .hero-cell{border-left:1px solid rgba(255,255,255,.16);padding-left:16px}
.hero-cell .hk{font-size:12px;color:rgba(255,255,255,.72);font-weight:600}
.hero-cell .hv{font-family:"Montserrat";font-weight:800;font-size:16px;margin-top:3px;letter-spacing:-.01em}
.hero.masked .hero-val,.hero.masked .hv{filter:blur(10px);-webkit-filter:blur(10px)}
.qacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0 2px}
.qact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);font:inherit;color:var(--ink);transition:transform .08s ease}
.qact:active{transform:scale(.96)}
.qact .qic{width:46px;height:46px;border-radius:14px;background:var(--good-bg);display:flex;align-items:center;justify-content:center;color:var(--green)}
.qact .qic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qact.gold .qic{background:var(--warn-bg);color:var(--gold-deep,#A87C2E)}
.qact.red .qic{background:var(--crit-bg);color:var(--crit)}
.qact b{font-size:13px;font-weight:700}
.perf{margin-top:20px}
.perf-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.perf-h h2{font-size:15px;font-weight:800;margin:0}
.perf-h .pp{font-size:12px;color:var(--muted);font-weight:700}
.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perf-cell{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 13px 14px;box-shadow:var(--shadow);text-align:left;min-width:0;font:inherit;color:inherit;transition:transform .08s ease}
.perf-cell:active{transform:scale(.98)}
.perf-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--good-bg);color:var(--green)}
.perf-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.perf-ic.good{background:var(--good-bg);color:var(--good)}
.perf-ic.red{background:var(--crit-bg);color:var(--crit)}
.perf-ic.gold{background:var(--warn-bg);color:var(--gold-deep,#A87C2E)}
.perf-cell .pl{display:block;font-size:12px;color:var(--muted);font-weight:600}
.perf-cell .pv{display:block;font-family:"Montserrat";font-weight:800;font-size:17.5px;letter-spacing:-.015em;line-height:1.15}
@media (max-width:380px){.perf-cell .pv{font-size:16px}}
:root[data-theme="dark"] .perf-ic{background:#15291F}
:root[data-theme="dark"] .perf-ic.red{background:#331D1A}
:root[data-theme="dark"] .perf-ic.gold{background:#2C2415}
.alert-cre{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:linear-gradient(135deg,var(--warn-bg) 0%,#F3E2BD 100%);border:1px solid #E7CF95;border-radius:16px;padding:13px 15px;margin-top:14px;box-shadow:var(--shadow);font:inherit;color:var(--ink)}
.alert-cre .ac-ic{width:42px;height:42px;border-radius:12px;background:rgba(176,125,24,.16);display:flex;align-items:center;justify-content:center;color:var(--gold-deep,#A87C2E);flex:none}
.alert-cre .ac-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.alert-cre .ac-m{flex:1;min-width:0;display:flex;flex-direction:column}
.alert-cre .ac-t{display:block;font-weight:800;font-size:14px}
.alert-cre .ac-s{display:block;font-size:11.5px;color:var(--warn);margin-top:1px}
.alert-cre .ac-v{display:block;font-family:"Montserrat";font-weight:800;font-size:17px;color:var(--gold-deep,#A87C2E);margin-top:3px;letter-spacing:-.01em}
.alert-cre .ac-go{color:var(--gold-deep,#A87C2E);font-size:21px;font-weight:800;flex:none}
.flat-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px;box-shadow:var(--shadow);font:inherit;color:var(--ink)}
.flat-row .fr-ic{color:var(--green);flex:none;display:flex}
.flat-row .fr-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.flat-row .fr-m{flex:1;font-weight:700;font-size:14px}
.flat-row .fr-c{background:var(--good-bg);color:var(--green);font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;min-width:22px;text-align:center}
.flat-row .fr-c.warn{background:var(--warn-bg);color:var(--warn)}
.flat-row .fr-chev{color:var(--muted);font-size:19px;font-weight:800;flex:none;line-height:1}
.sec-lab{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:24px 2px 10px}

/* ===================== CLIENTS — refonte premium ===================== */
.cli-top{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.cli-top h1{font-family:"Montserrat";font-weight:800;font-size:24px;margin:0}
.cli-count{background:var(--good-bg);color:var(--green);font-weight:800;font-size:13px;border-radius:999px;padding:3px 11px}
.cli-sum{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:12px 15px;box-shadow:var(--shadow);margin:12px 0 14px}
.cli-sum .cs-l{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.cli-sum .cs-v{font-family:"Montserrat";font-weight:800;font-size:25px;color:var(--gold-deep,#A87C2E);margin-top:2px;letter-spacing:-.015em}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.c-row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.c-hit{display:flex;align-items:center;gap:11px;flex:1;min-width:0;background:none;border:0;padding:0;margin:0;color:inherit;text-align:left;font:inherit}
.c-row .c-av{width:44px;height:44px;border-radius:50%;background:var(--good-bg);border:0;color:var(--green);font-size:15px}
.c-row .c-main{flex:1;min-width:0;display:flex;flex-direction:column}
.c-row .c-name{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-rap{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.c-rap b{display:block;font-family:"Montserrat";font-weight:800;font-size:15px;color:var(--ink);margin-top:1px;letter-spacing:-.01em}
.c-enc{flex:none;background:var(--surface);border:1.5px solid var(--green);color:var(--green);border-radius:11px;padding:9px 12px;font:inherit;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.c-enc svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.c-badge{flex:none;background:var(--good-bg);color:var(--good);font-weight:700;font-size:12px;border-radius:999px;padding:6px 13px}
.c-badge.adv{background:rgba(194,153,63,.15);color:#A87C2E}
.cli-add{position:sticky;bottom:12px;margin-top:16px}

/* ===================== Menu « Gestion » — refonte ===================== */
.menu-sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 2px 10px}
.menu-sec.first{margin-top:4px}
.m-card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);font:inherit;color:inherit;margin-bottom:10px;transition:transform .08s ease}
.m-card:active{transform:scale(.985)}
.m-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(135deg,#E8F3EC 0%,#CDE8D7 100%);color:var(--green);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.m-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.m-ic.gold{background:linear-gradient(135deg,#F8EDD4 0%,#EEDAA6 100%);color:var(--gold-deep,#A87C2E)}
.m-ic.blue{background:linear-gradient(135deg,#E9EEF3 0%,#D2DEE9 100%);color:#3F5C74}
.m-ic.red{background:linear-gradient(135deg,#F8E5E2 0%,#F3CFC9 100%);color:var(--crit)}
.m-main{flex:1;min-width:0;display:flex;flex-direction:column}
.m-name{display:block;font-weight:700;font-size:15px}
.m-sub{display:block;font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-chev{color:var(--muted);font-size:19px;font-weight:800;flex:none;line-height:1}
/* avatar dans l'en-tête */
.head-av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-family:"Montserrat";font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
/* état vide plus accueillant */
.item-empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}

/* ===================== MODE SOMBRE ===================== */
.theme-seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.theme-seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 6px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted)}
.theme-seg button.on{background:var(--green);color:#fff}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1512; --surface:#16211B; --surface-2:#1C2922; --line:#2A3730;
  --ink:#EAF1EC; --muted:#9BB0A4; --ink-soft:#C8D5CD;
  --green:#2E8A6A; --green-deep:#1C6B50;
  --gold:#D8B65F; --gold-soft:#E6CC82; --gold-deep:#E0BE6A;
  --good:#52C98A; --good-bg:#15291F; --warn:#E3BA63; --warn-bg:#2C2415;
  --crit:#EA8B81; --crit-bg:#331D1A; --neutral:#9FB3C4; --neutral-bg:#1E2630;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.65);
  --sheet-shadow:0 -8px 40px -12px rgba(0,0,0,.75);
}
:root[data-theme="dark"] .hero,:root[data-theme="dark"] .d-head{border:1px solid #2B3A32}
:root[data-theme="dark"] .m-ic{background:#1B3328;color:#74CFA4}
:root[data-theme="dark"] .m-ic.gold{background:#322A16;color:var(--gold-soft)}
:root[data-theme="dark"] .m-ic.blue{background:#1E2A33;color:#9FC3DE}
:root[data-theme="dark"] .m-ic.red{background:#331E1B;color:var(--crit)}
:root[data-theme="dark"] .alert-cre{background:#2B2415;border-color:#3E361F}
:root[data-theme="dark"] .qact .qic{background:#15291F}
:root[data-theme="dark"] .qact.gold .qic{background:#2C2415}
:root[data-theme="dark"] .qact.red .qic{background:#331D1A}
:root[data-theme="dark"] .c-enc{background:var(--surface)}
:root[data-theme="dark"] .role-badge{color:#201604}
/* tuiles de synthèse en lignes pleine largeur (nombres complets) */
.sumg{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:2px 14px;margin-top:4px}
.sumg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.sumg-row:last-child{border-bottom:0}
.sumg-l{font-size:13px;color:var(--muted);font-weight:600}
.sumg-v{font-family:"Montserrat";font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}

/* ===================== Icônes animées ===================== */
@keyframes bgbPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bgbFadeUp{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
.m-ic,.qact .qic,.perf-ic,.alert-cre .ac-ic,.flat-row .fr-ic{animation:bgbPop .42s cubic-bezier(.34,1.56,.64,1) both}
.m-card{animation:bgbFadeUp .34s ease both}
.m-card:nth-child(2){animation-delay:.02s}.m-card:nth-child(3){animation-delay:.04s}.m-card:nth-child(4){animation-delay:.06s}
.m-card:nth-child(5){animation-delay:.08s}.m-card:nth-child(6){animation-delay:.10s}.m-card:nth-child(7){animation-delay:.12s}
.qact:active .qic,.m-card:active .m-ic{animation:bgbPop .3s ease}
.tab.on svg{animation:bgbPop .35s cubic-bezier(.34,1.56,.64,1)}
.hero-eye:active svg{transform:scale(.8);transition:transform .12s}
@media (prefers-reduced-motion:reduce){.m-ic,.qact .qic,.perf-ic,.alert-cre .ac-ic,.flat-row .fr-ic,.m-card,.tab.on svg{animation:none!important}}
</style>

/* ===== HORS LIGNE / SYNCHRONISATION ===== */
var NET={ uid:null, syncing:false, snapAt:null };
var MEKEY='bgb_ger_me', SNAPKEY='bgb_ger_snap', QKEY='bgb_ger_queue';
function lsGet(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function curUid(){ return (ME&&ME.auth_user_id)||NET.uid||null; }
function cacheMe(){ lsSet(MEKEY,{uid:curUid(), me:ME, role:ROLE}); }
function cachedMe(uid){ var o=lsGet(MEKEY,null); return (o&&o.uid===uid)?o.me:null; }
function cacheSnap(){ lsSet(SNAPKEY,{uid:curUid(), at:Date.now(), S:{clients:S.clients,products:S.products,orders:S.orders,deliveries:S.deliveries,credits:S.credits,payments:S.payments,categories:S.categories,stock:S.stock,expenses:S.expenses,rules:S.rules,people:S.people,backups:S.backups,redemptions:S.redemptions,attachments:S.attachments,assets:S.assets,loans:S.loans,loanPayments:S.loanPayments}}); }
function restoreSnap(uid){ var o=lsGet(SNAPKEY,null); if(!o||o.uid!==uid||!o.S) return false; for(var k in o.S){ S[k]=o.S[k]||[]; } NET.snapAt=o.at; return true; }
function queueGet(){ return lsGet(QKEY,[]); }
function queueSet(q){ lsSet(QKEY,q); }
function queueAdd(op){ var q=queueGet(); op.localId='loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); op.queued_at=new Date().toISOString(); op.tries=0; q.push(op); queueSet(q); return op; }
function queueCount(){ return queueGet().filter(function(o){return !o._failed;}).length; }
function isNetErr(err){
  if(!navigator.onLine) return true;
  var m=((err&&(err.message||err.msg))||err||"").toString().toLowerCase();
  return m.indexOf('fetch')>=0||m.indexOf('network')>=0||m.indexOf('failed')>=0||m.indexOf('timeout')>=0||m.indexOf('offline')>=0;
}
async function applyOp(op){ return await sb.from(op.table).insert(op.payload); }
async function saveOp(op){
  if(navigator.onLine){
    try{
      var res=await applyOp(op);
      if(res&&res.error){ if(isNetErr(res.error)){ queueAdd(op); return {queued:true}; } return {error:res.error.message}; }
      return {ok:true};
    }catch(e){ if(isNetErr(e)){ queueAdd(op); return {queued:true}; } return {error:(e&&e.message)||'Erreur'}; }
  }
  queueAdd(op); return {queued:true};
}
async function syncQueue(){
  if(NET.syncing||!navigator.onLine){ renderSyncBar(); return; }
  var q=queueGet(); if(!q.length){ renderSyncBar(); return; }
  NET.syncing=true; renderSyncBar();
  var remain=[];
  for(var i=0;i<q.length;i++){ var op=q[i];
    try{ var res=await applyOp(op);
      if(res&&res.error){ op.tries=(op.tries||0)+1; if(!isNetErr(res.error)&&op.tries>=5) op._failed=true; remain.push(op); }
    }catch(e){ op.tries=(op.tries||0)+1; if(!isNetErr(e)&&op.tries>=5) op._failed=true; remain.push(op); }
  }
  queueSet(remain);
  NET.syncing=false;
  if(navigator.onLine){ try{ await loadAll(); }catch(e){} }
  render(); renderSyncBar();
  var done=q.length-remain.length;
  if(done>0) toast(done+' saisie(s) synchronisée(s) ✓');
}
function stripPending(arr){ return (arr||[]).filter(function(x){return !x._pending;}); }
function applyPendingToState(){
  S.deliveries=stripPending(S.deliveries); S.credits=stripPending(S.credits); S.payments=stripPending(S.payments);
  S.stock=stripPending(S.stock); S.expenses=stripPending(S.expenses);
  queueGet().forEach(function(op){
    var p=op.payload, base={id:op.localId,_pending:true,_failed:op._failed,created_at:op.queued_at};
    if(op.type==='deliv') S.deliveries.unshift(Object.assign({},p,base));
    else if(op.type==='credit') S.credits.unshift(Object.assign({},p,base));
    else if(op.type==='payment') S.payments.unshift(Object.assign({},p,base));
    else if(op.type==='stock') S.stock.unshift(Object.assign({},p,base));
    else if(op.type==='expense') S.expenses.unshift(Object.assign({},p,base));
  });
}
function finishEntry(r){
  if(r.error){ toast("Erreur : "+r.error); return; }
  closeSheet(); toast(r.queued?"Enregistré hors ligne — sera synchronisé":"Enregistré");
  if(navigator.onLine && !r.queued){ refresh(); } else { applyPendingToState(); render(); renderSyncBar(); }
}
function needsOnline(){ if(!navigator.onLine){ toast("Cette action nécessite une connexion Internet."); return true; } return false; }
function renderSyncBar(){
  var b=document.getElementById('netbar'); if(!b) return;
  var n=queueCount(), failed=queueGet().filter(function(o){return o._failed;}).length;
  if(!navigator.onLine){ b.className='netbar show off'; b.textContent='Hors ligne'+(n>0?(' — '+n+' saisie(s) en attente'):'')+' · synchronisation au retour du réseau'; return; }
  if(NET.syncing){ b.className='netbar show sync'; b.textContent='Synchronisation…'+(n>0?(' ('+n+')'):''); return; }
  if(n>0){ b.className='netbar show sync'; b.textContent=n+' saisie(s) en attente de synchronisation'; return; }
  if(failed>0){ b.className='netbar show off'; b.textContent=failed+' envoi(s) en échec — touchez pour réessayer'; return; }
  b.className='netbar'; b.textContent='';
}
window.addEventListener('online', function(){ renderSyncBar(); syncQueue(); });
window.addEventListener('offline', function(){ renderSyncBar(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden && navigator.onLine) syncQueue(); });
document.addEventListener('click', function(e){
  if(e.target && e.target.id==='netbar'){ var q=queueGet(); q.forEach(function(o){ o._failed=false; o.tries=0; }); queueSet(q); syncQueue(); }
});

/* ===== VERROUILLAGE AUTOMATIQUE (inactivité) ===== */
var LOCK={ IDLE:5*60*1000, last:Date.now(), locked:false, armed:false, timer:null, pendingSecret:null };
var LOCKKEY='bgb_ger_lock';
function bufToB64(buf){ var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s); }
function b64ToBuf(s){ var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a; }
async function hashSecret(secret, saltB64){
  var enc=new TextEncoder();
  var salt=saltB64?b64ToBuf(saltB64):crypto.getRandomValues(new Uint8Array(16));
  var k=await crypto.subtle.importKey('raw', enc.encode(String(secret)), {name:'PBKDF2'}, false, ['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:120000, hash:'SHA-256'}, k, 256);
  return { salt:bufToB64(salt), hash:bufToB64(bits) };
}
async function storeLock(secret){ try{ var lk=await hashSecret(secret); lsSet(LOCKKEY,{uid:curUid(), salt:lk.salt, hash:lk.hash}); }catch(e){} }
function hasLock(){ var r=lsGet(LOCKKEY,null); return !!(r&&r.uid===curUid()&&r.salt&&r.hash); }
async function verifyLock(entered){
  var r=lsGet(LOCKKEY,null); if(!(r&&r.uid===curUid()&&r.salt)) return false;
  try{ var lk=await hashSecret(entered, r.salt); return lk.hash===r.hash; }catch(e){ return false; }
}
/* --- Biométrie (empreinte / Face ID) via WebAuthn --- */
var BIOKEY='bgb_ger_bio';
async function bioAvailable(){ try{ return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){ return false; } }
function bioEnrolled(){ var r=lsGet(BIOKEY,null); return !!(r&&r.uid===curUid()&&r.credId); }
async function enrollBio(){
  try{
    if(!(await bioAvailable())) return false;
    var uid=curUid()||'bgb-user';
    var cred=await navigator.credentials.create({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp:{ name:'Bouliedou', id:location.hostname },
      user:{ id:new TextEncoder().encode(uid), name:((ME&&ME.full_name)||uid), displayName:((ME&&ME.full_name)||'Bouliedou') },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged', requireResidentKey:false },
      timeout:60000, attestation:'none'
    }});
    if(!cred) return false;
    lsSet(BIOKEY,{uid:curUid(), credId:bufToB64(cred.rawId)});
    return true;
  }catch(e){ return false; }
}
function disableBio(){ try{ localStorage.removeItem(BIOKEY); }catch(e){} }
async function bioUnlock(){
  var r=lsGet(BIOKEY,null); if(!(r&&r.uid===curUid()&&r.credId)) return false;
  try{
    var a=await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{ type:'public-key', id:b64ToBuf(r.credId) }],
      userVerification:'required', timeout:60000
    }});
    return !!a;
  }catch(e){ return false; }
}
async function doBioUnlock(){
  var ok=await bioUnlock();
  if(ok){ LOCK.locked=false; document.getElementById('lockscreen').hidden=true; LOCK.last=Date.now(); }
  else { var er=document.getElementById('lockErr'); if(er){ er.textContent='Biométrie non reconnue. Utilisez votre mot de passe.'; er.hidden=false; } }
}
async function offerBio(){
  try{
    if(!(await bioAvailable()) || bioEnrolled() || lsGet(BIOKEY+'_no',false)) return;
    openSheet('<h3>Déverrouillage biométrique</h3><p style="color:var(--muted);font-size:14px;margin:0 0 16px">Déverrouiller l\'application avec votre empreinte ou votre visage sur cet appareil ? Votre mot de passe reste disponible en secours.</p><div class="sheet-actions"><button class="btn btn-ghost" id="bioLater">Plus tard</button><button class="btn btn-green" id="bioNow">Activer</button></div>');
    document.getElementById('bioNow').addEventListener('click', async function(){ var ok=await enrollBio(); closeSheet(); toast(ok?'Biométrie activée ✓':'Activation impossible sur cet appareil'); });
    document.getElementById('bioLater').addEventListener('click', function(){ lsSet(BIOKEY+'_no',true); closeSheet(); });
  }catch(e){}
}
async function toggleBio(){
  if(bioEnrolled()){ disableBio(); toast('Biométrie désactivée'); render(); return; }
  if(!(await bioAvailable())){ toast('Biométrie non disponible sur cet appareil.'); return; }
  var ok=await enrollBio(); lsSet(BIOKEY+'_no',false); toast(ok?'Biométrie activée ✓':'Activation impossible'); render();
}
function bumpActivity(){ LOCK.last=Date.now(); }
function checkIdle(){ if(LOCK.armed && !LOCK.locked && (Date.now()-LOCK.last)>=LOCK.IDLE) lockNow(); }
function armIdle(){ LOCK.armed=true; LOCK.last=Date.now(); if(!LOCK.timer) LOCK.timer=setInterval(checkIdle, 15000); }
function disarmIdle(){ LOCK.armed=false; if(LOCK.timer){ clearInterval(LOCK.timer); LOCK.timer=null; } }
function doLockLogout(){ disarmIdle(); sb.auth.signOut().then(function(){ location.reload(); }).catch(function(){ location.reload(); }); }
function lockNow(){
  if(LOCK.locked) return;
  if(!hasLock()){ if(navigator.onLine) doLockLogout(); else { LOCK.last=Date.now(); } return; }
  LOCK.locked=true; if(typeof closeSheet==='function') closeSheet();
  var er=document.getElementById('lockErr'); if(er) er.hidden=true;
  var inp=document.getElementById('lockInput'); if(inp) inp.value='';
  document.getElementById('lockscreen').hidden=false;
  var bb=document.getElementById('bioBtn'); if(bb) bb.hidden=!bioEnrolled();
  setTimeout(function(){ var i=document.getElementById('lockInput'); if(i) i.focus(); },60);
}
['click','keydown','touchstart','mousemove','scroll','input'].forEach(function(ev){ document.addEventListener(ev, bumpActivity, {passive:true}); });
/* Verrouillage synchronisé : quand l'app passe en arrière-plan (téléphone verrouillé,

var BG_GRACE=10000;

  if(document.hidden){ LOCK.hiddenAt=Date.now(); }

window.addEventListener('pagehide', function(){ LOCK.hiddenAt=Date.now(); });
(function(){

    else { var er=document.getElementById('lockErr'); er.textContent='Mot de passe incorrect.'; er.hidden=false; }
  });
  var ll=document.getElementById('lockLogout'); if(ll) ll.addEventListener('click', doLockLogout);
  var bb=document.getElementById('bioBtn'); if(bb) bb.addEventListener('click', doBioUnlock);
})();

function feedItems(){

/* --- Notifications push --- */
function pushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function urlB64ToUint8(b){ var pad='='.repeat((4-b.length%4)%4); var s=(b+pad).replace(/-/g,'+').replace(/_/g,'/'); var raw=atob(s); var a=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
function pushEnabled(){ return lsGet(PUSHKEY,false)===true; }
async function enablePush(){
  if(!pushSupported()){ toast("Notifications non supportées sur cet appareil."); return false; }
  try{
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast("Notifications refusées dans les réglages."); return false; }
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8(VAPID_PUBLIC) });
    var j=sub.toJSON();
    var res=await sb.from('push_subscriptions').upsert({ auth_user_id:(ME&&ME.auth_user_id)||null, role:ROLE, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent }, { onConflict:'endpoint' });
    if(res.error){ toast("Erreur : "+res.error.message); return false; }
    lsSet(PUSHKEY,true); toast("Notifications activées ✓"); return true;
  }catch(e){ toast("Activation impossible : "+((e&&e.message)||e)); return false; }
}
async function disablePush(){
  try{ var reg=await navigator.serviceWorker.ready; var sub=await reg.pushManager.getSubscription(); if(sub){ var ep=sub.endpoint; await sub.unsubscribe(); await sb.from('push_subscriptions').delete().eq('endpoint',ep); } }catch(e){}

}
async function togglePush(){ if(pushEnabled()){ await disablePush(); } else { await enablePush(); } render(); }
async function refreshPush(){
  if(!pushEnabled()||!pushSupported()) return;
  try{ var reg=await navigator.serviceWorker.ready; var sub=await reg.pushManager.getSubscription(); if(!sub) return; var j=sub.toJSON();
    await sb.from('push_subscriptions').upsert({ auth_user_id:(ME&&ME.auth_user_id)||null, role:ROLE, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent }, { onConflict:'endpoint' });
  }catch(e){}
}

function money(n){ n=Number(n)||0; return new Intl.NumberFormat("fr-FR").format(Math.round(n))+" FG"; }

function initials(n){ var p=(n||"?").trim().split(/\s+/); return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase(); }
function today(){ return new Date().toISOString().slice(0,10); }

function by(arr,id){ return arr.filter(function(x){return x.client_id===id;}); }
function sum(arr,f){ return arr.reduce(function(a,x){return a+(Number(f?x[f]:x.amount)||0);},0); }
function clientOpening(c){ return (c&&c.opening_debt!=null)?(Number(c.opening_debt)||0):0; }

function totals(id){ var sales=sum(by(S.credits,id),'amount'), p=sum(by(S.payments,id),'amount'); var cl=S.clients.find(function(x){return x.id===id;}); var op=clientOpening(cl); var credit=op+sales; return {credit:credit,paye:p,du:Math.max(0,credit-p),avance:Math.max(0,p-credit),opening:op,sales:sales}; }
/* --- dépenses réelles vs mouvements caisse↔banque --- */
function isCashMove(x){ return x && x.category==='mouvement_cb'; }
/* Paiement à un fournisseur (règle une dette) — sortie de caisse, mais PAS une charge d'exploitation */
function isSupplierPay(x){ return x && x.category==='paiement_fournisseur'; }
/* Apport (argent du propriétaire vers l'entreprise) / Retrait (de l'entreprise vers le propriétaire) */
function isOwnerMove(x){ return x && (x.category==='apport'||x.category==='retrait'); }
/* Les « dépenses » (charges) excluent les transferts caisse↔banque, les paiements fournisseurs et les apports/retraits */
function realExpenses(){ return S.expenses.filter(function(x){ return !isCashMove(x) && !isSupplierPay(x) && !isOwnerMove(x); }); }
function cashMoves(){ return S.expenses.filter(isCashMove); }
/* --- Dettes fournisseurs : achats à crédit (paid=false) moins paiements fournisseurs --- */
function supplierDebtTotal(){
  var buys=S.stock.filter(function(x){return x.kind==='entree' && x.paid===false;}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  var pays=S.expenses.filter(isSupplierPay).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  return Math.max(0, buys-pays);
}
function supplierLedger(){
  var m={};
  function ens(n){ n=(n&&String(n).trim())||'Fournisseur'; if(!m[n]) m[n]={name:n,buys:0,pays:0}; return m[n]; }
  S.stock.forEach(function(x){ if(x.kind==='entree' && x.paid===false){ ens(x.supplier).buys+=Number(x.amount)||0; } });
  S.expenses.forEach(function(x){ if(isSupplierPay(x)){ ens(x.label).pays+=Number(x.amount)||0; } });
  return m;
}
/* --- Apports / retraits du propriétaire : net injecté dans l'entreprise --- */
function ownerTotals(){
  var apport=0, retrait=0;
  S.expenses.forEach(function(x){ var a=Number(x.amount)||0; if(x.category==='apport') apport+=a; else if(x.category==='retrait') retrait+=a; });
  return {apport:apport, retrait:retrait, net:apport-retrait};
}
/* --- Charges étalées : une dépense « payée d'avance » (prepaid_months = N) couvre N mois.
   La SORTIE DE CAISSE reste au jour du paiement (trésorerie inchangée), mais le COÛT
   est réparti sur les mois couverts, pour un bénéfice mensuel juste. --- */
function expMonths(x){
  var n=Math.max(1, Math.round(Number(x&&x.prepaid_months)||1));
  /* le coût se répartit à partir du mois de début de couverture s'il est précisé,
     sinon à partir du mois du paiement. */
  var startKey=(x&&x.prepaid_start&&String(x.prepaid_start).length>=7)?String(x.prepaid_start).slice(0,7):String((x&&x.date)||"").slice(0,7);
  if(startKey.length<7) return [];
  var y=Number(startKey.slice(0,4)), m=Number(startKey.slice(5,7)), out=[];
  for(var i=0;i<n;i++){ var k=m-1+i, yy=y+Math.floor(k/12), mo=(k%12)+1; out.push(yy+'-'+(mo<10?'0':'')+mo); }
  return out;
}
function monthInPer(ym, per){
  if(per==='all'||!per) return true;
  var t=today(), y=ym.slice(0,4), mo=Number(ym.slice(5,7)), ty=t.slice(0,4), tmo=Number(t.slice(5,7));
  if(per==='year')     return y===ty;
  if(per==='semester') return y===ty && (mo<=6)===(tmo<=6);
  if(per==='quarter')  return y===ty && Math.floor((mo-1)/3)===Math.floor((tmo-1)/3);
  if(per==='month' || per==='week') return ym===t.slice(0,7); /* semaine ≈ mois courant pour une charge mensuelle */
  return true;
}
/* coût (charge) d'une dépense tombant dans la période (réparti si payé d'avance) */
function expCharge(x, per){
  var months=expMonths(x); if(!months.length) return 0;
  var amt=Number(x.amount)||0;
  if(per==='all'||!per) return amt;
  var portion=amt/months.length, c=0;
  months.forEach(function(ym){ if(monthInPer(ym,per)) c+=portion; });
  return c;
}
function expensesCharge(per){ return realExpenses().reduce(function(a,x){ return a+expCharge(x,per); },0); }
/* charge d'un mois précis 'AAAA-MM' (pour les courbes d'évolution) */
function expChargeOfMonth(x, key){ var ms=expMonths(x); return ms.indexOf(key)>=0 ? (Number(x.amount)||0)/ms.length : 0; }

/* --- IMMOBILISATIONS & AMORTISSEMENTS ---
   L'achat d'une immobilisation SORT de la caisse à l'achat (comme un achat),
   mais ce n'est PAS une charge : seul l'AMORTISSEMENT (coût / durée) est une
   charge, réparti mois par mois sur la durée de vie du bien. */
function assetMonthlyAmort(a){ var cost=Number(a&&a.cost)||0, yrs=Math.max(1,Number(a&&a.years)||1); return cost/(yrs*12); }
function assetMonths(a){ /* mois 'AAAA-MM' sur lesquels le bien s'amortit */
  var yrs=Math.max(1,Number(a&&a.years)||1), n=yrs*12, d=String((a&&a.date)||'').slice(0,7);
  if(d.length<7) return [];
  var y=Number(d.slice(0,4)), m=Number(d.slice(5,7)), out=[];
  for(var i=0;i<n;i++){ var k=m-1+i, yy=y+Math.floor(k/12), mo=(k%12)+1; out.push(yy+'-'+(mo<10?'0':'')+mo); }
  return out;
}
function assetAccumAmort(a){ /* cumul d'amortissement à ce jour */
  var tc=today().slice(0,7), mth=assetMonthlyAmort(a), c=0;
  assetMonths(a).forEach(function(ym){ if(ym<=tc) c+=mth; });
  return Math.min(Number(a&&a.cost)||0, c);
}
function assetNet(a){ return Math.max(0, (Number(a&&a.cost)||0) - assetAccumAmort(a)); }
function amortOfMonth(key){ return (S.assets||[]).reduce(function(acc,a){ return acc + (assetMonths(a).indexOf(key)>=0 ? assetMonthlyAmort(a) : 0); },0); }
function amortCharge(per){
  var tc=today().slice(0,7), c=0;
  (S.assets||[]).forEach(function(a){ var mth=assetMonthlyAmort(a); assetMonths(a).forEach(function(ym){ if(ym>tc) return; if(per==='all'||!per||monthInPer(ym,per)) c+=mth; }); });
  return c;
}
function assetsTotals(){
  var brut=0,cumul=0; (S.assets||[]).forEach(function(a){ brut+=Number(a.cost)||0; cumul+=assetAccumAmort(a); });
  return {brut:brut, cumul:cumul, net:brut-cumul};
}

/* ===== EMPRUNTS (prêts reçus par l'entreprise) ===== */
function loanSchedule(l){
  var P=Number(l.principal)||0, r=Number(l.rate)||0, yrs=Math.max(1,Math.round(Number(l.years)||1)), type=l.rtype||'infine';
  var start=String(l.start_date||today()).slice(0,10);
  function addM(k){ var d=new Date(start+'T00:00:00'); if(isNaN(d)) d=new Date(); d.setMonth(d.getMonth()+k); return d.toISOString().slice(0,10); }
  var out=[];
  if(type==='annuity_month'){
    var i=r/12, n=yrs*12, M=i>0?P*i/(1-Math.pow(1+i,-n)):P/n, bal=P;
    for(var k=1;k<=n;k++){ var it=bal*i, cap=M-it; if(k===n) cap=bal; bal-=cap; out.push({date:addM(k),interest:it,capital:cap}); }
  } else if(type==='annuity_year'){
    var A=r>0?P*r/(1-Math.pow(1+r,-yrs)):P/yrs, b=P;
    for(var y=1;y<=yrs;y++){ var iy=b*r, cy=A-iy; if(y===yrs) cy=b; b-=cy; out.push({date:addM(y*12),interest:iy,capital:cy}); }
  } else if(type==='constant_principal'){
    var cpp=P/yrs, bb=P;
    for(var z=1;z<=yrs;z++){ var ic=bb*r; bb-=cpp; out.push({date:addM(z*12),interest:ic,capital:cpp}); }
  } else { /* in fine */
    for(var w=1;w<=yrs;w++){ out.push({date:addM(w*12),interest:P*r,capital:(w===yrs?P:0)}); }
  }
  return out;
}
function loanTypeLabel(t){ var m={infine:"In fine (intérêts annuels, capital à la fin)",annuity_month:"Mensualités constantes",annuity_year:"Annuités constantes",constant_principal:"Amortissement constant"}; return m[t]||m.infine; }
function loanCapitalPaid(lid){ return (S.loanPayments||[]).filter(function(x){return x.loan_id===lid;}).reduce(function(a,x){return a+(Number(x.capital)||0);},0); }
function loanInterestPaidTotal(lid){ return (S.loanPayments||[]).filter(function(x){return x.loan_id===lid;}).reduce(function(a,x){return a+(Number(x.interest)||0);},0); }
function loanBalance(l){ return Math.max(0,(Number(l.principal)||0)-loanCapitalPaid(l.id)); }
function loansTotals(){ var e=0,rest=0,ip=0; (S.loans||[]).forEach(function(l){ e+=Number(l.principal)||0; rest+=loanBalance(l); ip+=loanInterestPaidTotal(l.id); }); return {emprunte:e, restant:rest, interets:ip}; }
function loanNextDue(l){ var s=loanSchedule(l), paid=(S.loanPayments||[]).filter(function(x){return x.loan_id===l.id;}).length; return s[paid]||null; }
function loanInterestCharge(per){ return (S.loanPayments||[]).reduce(function(a,x){ return a+((per==='all'||!per||inPer(x.date,per))?(Number(x.interest)||0):0); },0); }
function loanInterestOfMonth(key){ return (S.loanPayments||[]).reduce(function(a,x){ return a+((String(x.date||'').slice(0,7)===key)?(Number(x.interest)||0):0); },0); }
/* --- trésorerie : flux caisse / banque pour une période (balances = période 'all') --- */
function payMethod(x){ return (x&&x.method==='banque')?'banque':'caisse'; }
function treasury(per){
  function inp(d){ return (per==='all'||!per)?true:inPer(d,per); }
  var t={ckIn:0,bkIn:0,ckOutDep:0,bkOutDep:0,ckOutAch:0,bkOutAch:0,ck2bk:0,bk2ck:0,ckOutFour:0,bkOutFour:0,ckInOwner:0,bkInOwner:0,ckOutOwner:0,bkOutOwner:0,ckOutAsset:0,bkOutAsset:0};
  S.payments.forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='banque') t.bkIn+=a; else t.ckIn+=a; });
  realExpenses().forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='banque') t.bkOutDep+=a; else t.ckOutDep+=a; });
  /* achats réglés comptant seulement (un achat à crédit ne sort pas de caisse tant qu'il n'est pas payé) */
  S.stock.forEach(function(x){ if(x.kind!=='entree'||isOpening(x)||x.paid===false||!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='banque') t.bkOutAch+=a; else t.ckOutAch+=a; });
  cashMoves().forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0; if(payMethod(x)==='caisse') t.ck2bk+=a; else t.bk2ck+=a; });
  /* paiements fournisseurs + apports/retraits du propriétaire */
  S.expenses.forEach(function(x){ if(!inp(x.date))return; var a=Number(x.amount)||0;
    if(isSupplierPay(x)){ if(payMethod(x)==='banque') t.bkOutFour+=a; else t.ckOutFour+=a; }
    else if(x.category==='apport'){ if(payMethod(x)==='banque') t.bkInOwner+=a; else t.ckInOwner+=a; }
    else if(x.category==='retrait'){ if(payMethod(x)==='banque') t.bkOutOwner+=a; else t.ckOutOwner+=a; }
  });
  /* achat d'immobilisations : sortie de caisse au moment de l'achat (pas une charge) */
  (S.assets||[]).forEach(function(a){ if(!inp(a.date))return; var v=Number(a.cost)||0; if(payMethod(a)==='banque') t.bkOutAsset+=v; else t.ckOutAsset+=v; });
  /* emprunts : argent reçu à la date de déblocage (entrée) ; remboursements (sortie) */
  var ckLoanIn=0,bkLoanIn=0,ckLoanOut=0,bkLoanOut=0;
  (S.loans||[]).forEach(function(l){ if(!inp(l.start_date))return; var v=Number(l.principal)||0; if(payMethod(l)==='banque') bkLoanIn+=v; else ckLoanIn+=v; });
  (S.loanPayments||[]).forEach(function(x){ if(!inp(x.date))return; var v=(Number(x.interest)||0)+(Number(x.capital)||0); if(payMethod(x)==='banque') bkLoanOut+=v; else ckLoanOut+=v; });
  t.caisse = t.ckIn - t.ckOutDep - t.ckOutAch - t.ckOutFour - t.ckOutAsset - t.ck2bk + t.bk2ck + t.ckInOwner - t.ckOutOwner + ckLoanIn - ckLoanOut;
  t.banque = t.bkIn - t.bkOutDep - t.bkOutAch - t.bkOutFour - t.bkOutAsset - t.bk2ck + t.ck2bk + t.bkInOwner - t.bkOutOwner + bkLoanIn - bkLoanOut;
  t.total  = t.caisse + t.banque;
  t.inflow = t.ckIn + t.bkIn + t.ckInOwner + t.bkInOwner + ckLoanIn + bkLoanIn;
  t.outflow= t.ckOutDep + t.bkOutDep + t.ckOutAch + t.bkOutAch + t.ckOutFour + t.bkOutFour + t.ckOutOwner + t.bkOutOwner + t.ckOutAsset + t.bkOutAsset + ckLoanOut + bkLoanOut;
  t.net    = t.inflow - t.outflow;
  return t;
}

function stockValueTotal(){
  var m=stockByProduct(), tot=0;
  Object.keys(m).forEach(function(k){ var r=m[k]; tot+=(r.ckyNet+r.routeNet)*r.avg; });
  return tot;
}
function benefFor(period){
  function inP(d){ if(period==="all") return true; return String(d||"").slice(0,7)===today().slice(0,7); }
  function s(arr){ return arr.filter(function(x){return inP(x.date);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0); }
  var pp=(period==='all'?'all':'month');
  var ventes=s(S.credits), depenses=expensesCharge(pp)+amortCharge(pp)+loanInterestCharge(pp);
  var achats=S.stock.filter(function(x){return x.kind==='entree'&&!isOpening(x)&&inP(x.date);}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
  return ventes-achats-depenses;
}
/* ---- period filtering (semaine / mois / trimestre / semestre / année / tout) ---- */
function _qtr(d){ return Math.floor((Number(d.slice(5,7))-1)/3); }
function _weekStart(d){ var dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; var day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); return dt.toISOString().slice(0,10); }
function inPer(dateStr,per){
  var d=String(dateStr||"").slice(0,10); if(!d) return false; if(per==="all") return true;
  var t=today();
  if(per==="week")     return _weekStart(d)===_weekStart(t);
  if(per==="month")    return d.slice(0,7)===t.slice(0,7);
  if(per==="quarter")  return d.slice(0,4)===t.slice(0,4) && _qtr(d)===_qtr(t);
  if(per==="semester") return d.slice(0,4)===t.slice(0,4) && (Number(d.slice(5,7))<=6)===(Number(t.slice(5,7))<=6);
  if(per==="year")     return d.slice(0,4)===t.slice(0,4);
  return true;
}
var PERIODS=[["week","Semaine"],["month","Mois"],["quarter","Trimestre"],["semester","Semestre"],["year","Année"],["all","Tout"]];
function perLabel(per){ var f=PERIODS.filter(function(p){return p[0]===per;})[0]; return f?f[1]:"Mois"; }
function periodBar(cur,attr){
  return '<div class="perbar">'+PERIODS.map(function(p){
    return '<button class="perchip'+(p[0]===cur?' on':'')+'" data-'+attr+'="'+p[0]+'">'+p[1]+'</button>';
  }).join('')+'</div>';
}
/* ---- stock aggregated to the 3 levels (value FG, weighted avg purchase price) ---- */
function stockLevels(){
  var m=stockByProduct(), route=0,cky=0,qRoute=0,qCky=0,triageKg=0,triageVal=0;
  Object.keys(m).forEach(function(pid){ var r=m[pid];
    cky+=r.ckyNet*r.avg; route+=r.routeNet*r.avg; qCky+=r.ckyNet; qRoute+=r.routeNet;
    triageKg+=r.triage; triageVal+=r.triage*r.avg; });
  return {route:route, cky:cky, total:route+cky, qRoute:qRoute, qCky:qCky, triageKg:triageKg, triageVal:triageVal};
}
/* ---- stock aggregated per category (kg + value) ---- */
function stockByCategory(){
  var m=stockByProduct(), out={};
  Object.keys(m).forEach(function(pid){ var p=prodById(pid); var c=p?prodCat(p):null; var key=c?c.id:'__nc'; var u=prodUnits(pid); var r=m[pid];
    if(!out[key]) out[key]={name:(c?c.name:"Sans catégorie"), su:u.su, qCky:0,qRoute:0,vCky:0,vRoute:0};
    var o=out[key]; o.qCky+=r.ckyNet; o.qRoute+=r.routeNet; o.vCky+=r.ckyNet*r.avg; o.vRoute+=r.routeNet*r.avg; });
  return out;
}

/* produits qu'un client a réellement pris à crédit (distincts) */
function clientBoughtProducts(clientId){
  var seen={}, out=[];
  by(S.credits, clientId).forEach(function(x){ var pid=x.product_id; if(pid && !seen[pid]){ seen[pid]=1; var p=prodById(pid); out.push({id:pid, name:(p?p.name:(x.label||'Produit'))}); } });
  return out;
}
/* produits présents dans au moins une vente à crédit (pour le filtre clients) */
function productsWithCredits(){
  var seen={}, out=[];
  S.credits.forEach(function(x){ var pid=x.product_id; if(pid && !seen[pid]){ seen[pid]=1; var p=prodById(pid); if(p) out.push(p); } });
  return out.sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
}

/* ===== STOCK EN KG (poids réel) ===== */
function prodContentOf(x){
  var c=(x&&x.content_per_unit!=null&&x.content_per_unit!=="")?Number(x.content_per_unit):null;
  if(!c){ var p=prodById(x&&x.product_id); c=(p&&p.content_per_unit!=null)?Number(p.content_per_unit):null; }
  return (c&&c>0)?c:1;
}
function entryKg(x){ if(x&&x.qty_kg!=null&&x.qty_kg!=="") return Number(x.qty_kg)||0; return (Number(x&&x.qty)||0)*prodContentOf(x); }
function prodUnits(pid){ var p=prodById(pid), c=p?prodCat(p):null; var content=(p&&p.content_per_unit!=null)?Number(p.content_per_unit):((c&&c.content_per_unit!=null)?Number(c.content_per_unit):1); return {su:(c?c.sale_unit:'unité'), ou:(c?c.order_unit:''), content:(content>0?content:1)}; }
function stkQty(kg,pid){ var u=prodUnits(pid); var txt=rnd(kg)+' '+esc(u.su); if(u.ou&&u.ou!==u.su&&u.content>1){ txt+=' <span style="color:var(--muted)">(≈ '+rnd(kg/u.content)+' '+esc(u.ou)+')</span>'; } return txt; }
/* m[pid] : tout en kg — cky/route (entrées), transfer (acheminé route→Conakry), sortie (ventes), triage (manques) */
function stockByProduct(){
  var m={};
  function ens(pid){ if(!m[pid]) m[pid]={cky:0,route:0,transfer:0,sortie:0,triage:0,sold:0,qtyIn:0,amtIn:0}; return m[pid]; }
  S.stock.forEach(function(x){ if(!x.product_id) return;
    var r=ens(x.product_id), kg=entryKg(x);
    if(x.kind==='transfert'){ r.transfer+=kg; }
    else if(x.kind==='sortie'){ if(x.reason==='triage') r.triage+=kg; else r.sortie+=kg; }
    else { var loc=(x.location==='route')?'route':'cky'; r[loc]+=kg; r.qtyIn+=kg; r.amtIn+=Number(x.amount)||0; }
  });
  // ventes (crédits) : le poids vendu sort automatiquement du stock Conakry
  S.credits.forEach(function(x){ if(!x.product_id) return; var kg=Number(x.content_qty)||0; if(kg>0) ens(x.product_id).sold+=kg; });
  // niveaux nets (kg)
  Object.keys(m).forEach(function(k){ var r=m[k];
    r.routeNet=Math.max(0, r.route - r.transfer);
    // Les manques / triages / cassées proviennent de sacs DÉJÀ vendus :
    // ils se déduisent des sacs vendus, PAS du stock présent à Conakry.
    r.ckyNet=Math.max(0, r.cky + r.transfer - r.sortie - r.sold);
    r.soldNet=Math.max(0, r.sold - r.triage); // poids réellement conservé par le client
    r.avg=r.qtyIn>0?r.amtIn/r.qtyIn:0; // coût moyen pondéré par kg
  });
  return m;
}

  else { contFor=(p&&p.content_per_unit)||(c&&c.content_per_unit)||1; }

function routeSacs(pid){ var u=prodUnits(pid); var av=stockByProduct()[pid]; return av?(av.routeNet/(u.content>0?u.content:1)):0; }

    var hint=document.getElementById("a_hint"); if(hint) hint.innerHTML="Disponible « non acheminé » : <b>"+av+" "+esc(u.ou||'sac')+"</b>"+(u.content>1?(" (soit "+rnd(av*u.content)+" "+esc(u.su)+")"):""); }
  if(sp) sp.addEventListener("change",sync);
  var qf=document.getElementById("a_qty"); if(qf) qf.addEventListener("input",function(){ var av=rnd(routeSacs(V("a_prod"))); if(Number(qf.value)>av) qf.value=av; });

/* Acheminement : on déplace les entrées « route » vers « Conakry » (colonne
   location). Ni nouveau type de mouvement, ni contrainte de base à modifier :
   le stock acheminé devient immédiatement disponible et valorisé à Conakry,
   et diminue d'autant le stock non acheminé. Les montants d'achat sont
   répartis au prorata quand on n'achemine qu'une partie d'un lot. */
async function saveAcheminement(){
  var pid=V("a_prod")||null; if(!pid){ toast("Choisissez un produit."); return; }
  var sacs=numOrNull("a_qty"); if(!sacs||sacs<=0){ toast("Indiquez le nombre de sacs."); return; }
  if(needsOnline()) return;
  var u=prodUnits(pid), availSacs=routeSacs(pid);
  if(sacs>availSacs+0.001){ toast("Vous ne pouvez pas acheminer plus que "+rnd(availSacs)+" "+(u.ou||'sac')+" disponible(s)."); return; }
  var content=(u.content>0?u.content:1), needKg=Math.round(sacs*content*1000)/1000, EPS=0.001, d=V("a_date")||today();
  var routeRows=S.stock.filter(function(x){return x.product_id===pid && x.kind==='entree' && x.location==='route';})
    .slice().sort(function(a,b){return (String(a.date||'').localeCompare(String(b.date||'')))||(String(a.created_at||'').localeCompare(String(b.created_at||'')));});
  var err=null, moved=0;
  for(var i=0;i<routeRows.length && needKg>EPS;i++){
    var x=routeRows[i], xKg=entryKg(x); if(xKg<=EPS) continue;
    if(xKg<=needKg+EPS){
      // le lot entier part à Conakry
      var r=await sb.from('stock_entries').update({location:'conakry'}).eq('id',x.id);
      if(r&&r.error){ err=r.error; break; }
      needKg=Math.round((needKg-xKg)*1000)/1000; moved++;
    } else {
      // acheminement partiel : on scinde le lot (reste en route + part à Conakry)
      var frac=needKg/xKg, movedKg=Math.round(needKg*1000)/1000, remKg=Math.round((xKg-needKg)*1000)/1000;
      var amt=Number(x.amount)||0, movedAmt=Math.round(amt*frac), remAmt=amt-movedAmt;
      var qty=(x.qty!=null&&x.qty!=="")?Number(x.qty):null, movedQty=(qty!=null)?Math.round(qty*frac*1000)/1000:null, remQty=(qty!=null)?Math.round((qty-movedQty)*1000)/1000:null;
      var r1=await sb.from('stock_entries').update({qty_kg:remKg, amount:remAmt, qty:remQty}).eq('id',x.id);
      if(r1&&r1.error){ err=r1.error; break; }
      var r2=await sb.from('stock_entries').insert({kind:'entree', location:'conakry', product_id:pid, label:(x.label||(prodById(pid)?prodById(pid).name:'Acheminement')), qty:movedQty, qty_kg:movedKg, unit:(x.unit||u.ou||'sac'), amount:movedAmt, content_per_unit:(x.content_per_unit!=null?x.content_per_unit:null), supplier:(x.supplier||null), date:(x.date||d), note:'acheminé vers Conakry'});
      if(r2&&r2.error){ err=r2.error; break; }
      needKg=0; moved++;
    }
  }
  if(err){ toast("Erreur acheminement : "+err.message); await refresh(); return; }
  if(!moved){ toast("Aucun stock « non acheminé » à acheminer."); return; }
  closeSheet(); toast("Acheminé vers Conakry ✓"); await refresh();
}

/* Les images sont compressées dans l'application puis stockées dans la table
   « attachments ». loadAll ne charge que les métadonnées (léger) ; l'image
   n'est téléchargée qu'au moment de la consulter. */
function attachmentsFor(kind, refId){ return (S.attachments||[]).filter(function(a){ return a.kind===kind && String(a.ref_id)===String(refId); }); }
function compressImage(file, maxDim, quality){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.width||1, h=img.height||1, s=Math.min(1, maxDim/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
      var c=document.createElement('canvas'); c.width=cw; c.height=ch;
      try{ c.getContext('2d').drawImage(img,0,0,cw,ch); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality)); }
      catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('image illisible')); };
    img.src=url;
  });
}
function attachPhoto(kind, refId){
  if(needsOnline()) return;
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.onchange=async function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    toast('Traitement de la photo…');
    var dataUrl; try{ dataUrl=await compressImage(f, 1400, 0.55); }catch(e){ toast('Photo illisible, réessayez.'); return; }
    var res=await sb.from('attachments').insert({kind:kind, ref_id:String(refId), data:dataUrl, name:(f.name||'photo.jpg'), created_by:curUid()});
    if(res.error){ toast('Erreur : '+res.error.message); return; }
    toast('Pièce jointe ajoutée ✓'); await refresh();
  };
  inp.click();
}

async function saveOrderAsSale(id){

/* Push (automatique) : appel non bloquant de la fonction serveur « notify ».

}
