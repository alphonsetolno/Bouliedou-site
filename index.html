<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bouliedou Global Business</title>
<meta name="description" content="Bouliedou Global Business — commerce, agribusiness, élevage et prestations de services en Guinée.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0C4A39; --green-deep:#06382C; --green-900:#042A20;
    --gold:#C2993F; --gold-soft:#D8B65F; --gold-deep:#A87C2E;
    --ivory:#FBF8EF; --cream:#F5EFDE; --paper:#FFFFFF;
    --ink:#1B2821; --muted:#5B6B62; --line:#E7E1CF;
    --maxw:1140px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ivory);color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.mont{font-family:"Montserrat",sans-serif}
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(18px,4vw,36px)}
  section{scroll-margin-top:84px}

  /* ---------- NAV ---------- */
  .nav{position:sticky;top:0;z-index:50;background:rgba(251,248,239,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mk{width:44px;height:44px;flex:none}
  .brand .txt{display:flex;flex-direction:column;line-height:1}
  .brand .txt .n{font-family:"Montserrat";font-weight:800;font-size:17px;color:var(--green);letter-spacing:.3px}
  .brand .txt .s{font-family:"Montserrat";font-weight:600;font-size:7.5px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-top:3px}
  .nav-links{display:flex;align-items:center;gap:26px}
  .nav-links a{font-weight:600;font-size:14.5px;color:var(--ink);padding:6px 0;position:relative}
  .nav-links a:hover{color:var(--green)}
  .nav-tools{display:flex;align-items:center;gap:12px}
  .lang{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
  .lang button{font:inherit;font-weight:700;font-size:12px;padding:6px 10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
  .lang button.on{background:var(--green);color:#fff}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;border-radius:999px;padding:11px 18px;cursor:pointer;border:1px solid transparent;transition:transform .15s ease,background .15s ease}
  .btn:hover{transform:translateY(-1px)}
  .btn-wa{background:#1FA855;color:#fff}
  .btn-gold{background:var(--gold);color:#1a1205}
  .btn-outline{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
  .btn-green{background:var(--green);color:#fff}
  .burger{display:none;border:1px solid var(--line);background:var(--paper);border-radius:10px;width:42px;height:38px;cursor:pointer;align-items:center;justify-content:center}
  .burger span{display:block;width:18px;height:2px;background:var(--green);position:relative}
  .burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--green)}
  .burger span::before{top:-5px}.burger span::after{top:5px}

  @media (max-width:860px){
    .nav-links{position:absolute;top:68px;left:0;right:0;background:var(--ivory);border-bottom:1px solid var(--line);
      flex-direction:column;align-items:flex-start;gap:0;padding:8px 20px 16px;display:none;box-shadow:0 18px 30px -20px rgba(0,0,0,.3)}
    .nav-links.open{display:flex}
    .nav-links a{width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
    .burger{display:flex}
    .nav .desk-cta{display:none}
  }

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;background:
      radial-gradient(120% 90% at 85% 0%, rgba(216,182,95,.18), transparent 55%),
      linear-gradient(160deg, var(--green) 0%, var(--green-deep) 55%, var(--green-900) 100%);
    color:#fff}
  .hero::after{content:"";position:absolute;right:-120px;bottom:-140px;width:460px;height:460px;border-radius:50%;
    border:1.5px solid rgba(216,182,95,.22);box-shadow:0 0 0 40px rgba(216,182,95,.05)}
  .hero-in{position:relative;z-index:2;padding:clamp(56px,9vw,104px) 0 clamp(50px,8vw,92px);max-width:760px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:"Montserrat";font-weight:700;font-size:12px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);margin:0 0 20px}
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--gold);border-radius:2px}
  .hero h1{font-weight:800;font-size:clamp(32px,6vw,58px);line-height:1.04;letter-spacing:-.015em;margin:0 0 20px;text-wrap:balance}
  .hero h1 .hl{color:var(--gold-soft)}
  .hero p{font-size:clamp(16px,2.1vw,19px);color:rgba(255,255,255,.82);max-width:60ch;margin:0 0 30px}
  .hero-cta{display:flex;flex-wrap:wrap;gap:14px}
  .hero-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:38px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:#fff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 14px}
  .chip .d{width:7px;height:7px;border-radius:50%;background:var(--gold-soft)}

  /* ---------- SECTION BASICS ---------- */
  .sec{padding:clamp(56px,8vw,96px) 0}
  .sec-head{max-width:640px;margin:0 0 40px}
  .kicker{font-family:"Montserrat";font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 12px;display:flex;align-items:center;gap:9px}
  .kicker::before{content:"";width:22px;height:2px;background:var(--gold);border-radius:2px}
  .sec h2{font-weight:800;font-size:clamp(26px,4vw,40px);line-height:1.1;letter-spacing:-.01em;margin:0 0 14px;color:var(--green);text-wrap:balance}
  .sec .intro{font-size:16px;color:var(--muted);margin:0}

  /* ---------- POLES ---------- */
  .poles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media (max-width:720px){.poles{grid-template-columns:1fr}}
  .pole{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;
    box-shadow:0 1px 2px rgba(12,44,44,.04),0 18px 36px -26px rgba(12,44,44,.3);transition:transform .18s ease,box-shadow .18s ease}
  .pole:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(12,44,44,.05),0 26px 44px -26px rgba(12,44,44,.4)}
  .pole .ic{width:52px;height:52px;border-radius:13px;background:rgba(194,153,63,.12);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .pole .ic svg{width:27px;height:27px;stroke:var(--gold-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .pole h3{font-weight:700;font-size:19px;margin:0 0 8px;color:var(--green)}
  .pole p{font-size:14.5px;color:var(--muted);margin:0}

  /* ---------- ABOUT ---------- */
  .about{background:var(--cream)}
  .about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,60px);align-items:center}
  @media (max-width:820px){.about-grid{grid-template-columns:1fr}}
  .about p{font-size:15.5px;color:#3a4a41;margin:0 0 16px}
  .about p:last-child{margin-bottom:0}
  .about .em{color:var(--green);font-weight:700}
  .badge-stack{display:flex;flex-direction:column;gap:14px}
  .vcard{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:18px 20px}
  .vcard h4{font-family:"Montserrat";font-weight:700;font-size:15px;margin:0 0 4px;color:var(--green)}
  .vcard p{font-size:13.5px;color:var(--muted);margin:0}

  /* ---------- WHY (strip) ---------- */
  .why{background:var(--green-deep);color:#fff}
  .why .sec h2{color:#fff}
  .why .kicker{color:var(--gold-soft)}
  .why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
  @media (max-width:820px){.why-grid{grid-template-columns:1fr 1fr}}
  @media (max-width:480px){.why-grid{grid-template-columns:1fr}}
  .why-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px}
  .why-item .n{font-family:"Montserrat";font-weight:800;font-size:15px;color:var(--gold-soft);margin-bottom:10px}
  .why-item h3{font-weight:700;font-size:16px;margin:0 0 6px}
  .why-item p{font-size:13.5px;color:rgba(255,255,255,.72);margin:0}

  /* ---------- CUSTOM SECTIONS ---------- */
  .custom .ctext{max-width:760px;font-size:15.5px;color:#3a4a41}
  .custom .ctext p{margin:0 0 14px}
  .custom .ctext p:last-child{margin-bottom:0}

  /* ---------- CONTACT ---------- */
  .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(26px,5vw,52px)}
  @media (max-width:820px){.contact-grid{grid-template-columns:1fr}}
  .cinfo .line{display:flex;align-items:flex-start;gap:13px;margin-bottom:20px}
  .cinfo .line .ci{width:40px;height:40px;border-radius:11px;background:rgba(12,74,57,.08);display:flex;align-items:center;justify-content:center;flex:none}
  .cinfo .line .ci svg{width:19px;height:19px;stroke:var(--green);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .cinfo .line .lb{font-family:"Montserrat";font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep)}
  .cinfo .line .vl{font-size:15px;color:var(--ink);font-weight:500}
  .cinfo .wa{margin-top:6px}
  form{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,30px);box-shadow:0 18px 40px -28px rgba(12,44,44,.4)}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:"Montserrat";font-weight:600;font-size:12.5px;color:var(--green);margin-bottom:6px}
  .field input,.field textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--ivory);
    border:1px solid var(--line);border-radius:11px;padding:12px 14px;outline:none;transition:border .15s}
  .field input:focus,.field textarea:focus{border-color:var(--gold)}
  .field textarea{min-height:120px;resize:vertical}
  form .btn-green{width:100%;justify-content:center;font-size:15px;padding:14px}
  .formnote{font-size:12.5px;color:var(--muted);margin:12px 0 0;text-align:center}

  /* ---------- FOOTER ---------- */
  footer{background:var(--green-900);color:rgba(255,255,255,.75);padding:52px 0 28px}
  .foot-top{display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between;align-items:flex-start;padding-bottom:28px;border-bottom:1px solid rgba(255,255,255,.1)}
  .foot-brand{max-width:320px}
  .foot-brand .mk{width:56px;height:56px;margin-bottom:14px}
  .foot-brand p{font-size:13.5px;color:rgba(255,255,255,.6);margin:0}
  .foot-cols{display:flex;gap:54px;flex-wrap:wrap}
  .foot-col h4{font-family:"Montserrat";font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft);margin:0 0 14px}
  .foot-col a,.foot-col div{display:block;font-size:14px;color:rgba(255,255,255,.72);margin-bottom:9px}
  .foot-col a:hover{color:#fff}
  .foot-bottom{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-top:22px;font-size:12.5px;color:rgba(255,255,255,.5)}
  .pill-line{font-family:"Montserrat";font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}
  /* ---------- GALLERY ---------- */
  .gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:760px){.gal-grid{grid-template-columns:1fr 1fr}}
  @media (max-width:460px){.gal-grid{grid-template-columns:1fr}}
  .gtile{position:relative;aspect-ratio:4/3;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;overflow:hidden}
  .gtile.green{background:linear-gradient(155deg,var(--green) 0%,var(--green-deep) 100%)}
  .gtile.cream{background:var(--cream);border:1px solid var(--line)}
  .gtile .gic{width:40px;height:40px;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .gtile.green .gic{stroke:var(--gold-soft)} .gtile.cream .gic{stroke:var(--gold-deep)}
  .gtile .cap{font-family:"Montserrat";font-weight:700;font-size:14px;letter-spacing:.02em}
  .gtile.green .cap{color:#fff} .gtile.cream .cap{color:var(--green)}
  .gtile .ph{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .gtile.green .ph{color:rgba(255,255,255,.55)} .gtile.cream .ph{color:var(--muted)}
  .gtile.has-img{color:#fff}
  .gtile.has-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .gtile.has-img .cap{position:relative;z-index:2;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .gtile.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,42,32,.6),transparent 55%)}
  .gtile.has-img .cap{z-index:3}
  .gal-note{font-size:13px;color:var(--muted);margin:20px 0 0;text-align:center}
  /* ---------- MAP / LOCATION ---------- */
  .maps{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;justify-content:space-between;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-deep) 100%);color:#fff;border-radius:18px;padding:24px 26px;
    position:relative;overflow:hidden}
  .maps::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1.5px solid rgba(216,182,95,.22)}
  .maps .mi{display:flex;align-items:center;gap:15px;position:relative;z-index:2}
  .maps .pin{width:46px;height:46px;border-radius:12px;background:rgba(216,182,95,.16);display:flex;align-items:center;justify-content:center;flex:none}
  .maps .pin svg{width:22px;height:22px;stroke:var(--gold-soft);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .maps .lb{font-family:"Montserrat";font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft)}
  .maps .vl{font-size:16px;font-weight:600;margin-top:2px}
  .maps .btn-gold{position:relative;z-index:2}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<!-- logo symbol -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="bgb" viewBox="0 0 300 300">
    <path d="M150 12 L269.5 81 L269.5 219 L150 288 L30.5 219 L30.5 81 Z" fill="none" stroke="var(--mk-stroke,#0C4A39)" stroke-width="15" stroke-linejoin="round"/>
    <path d="M150 12 L269.5 81" fill="none" stroke="var(--mk-gold,#C2993F)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="156" text-anchor="middle" dominant-baseline="central" font-size="100" font-family="Montserrat, sans-serif" font-weight="800" letter-spacing="-3"><tspan fill="var(--mk-stroke,#0C4A39)">B</tspan><tspan fill="var(--mk-gold,#C2993F)">G</tspan><tspan fill="var(--mk-stroke,#0C4A39)">B</tspan></text>
  </symbol>
</defs></svg>

<!-- ============ NAV ============ -->
<div class="nav">
  <div class="wrap nav-in">
    <a href="#accueil" class="brand" aria-label="Bouliedou Global Business">
      <svg class="mk" viewBox="0 0 300 300"><use href="#bgb"/></svg>
      <span class="txt"><span class="n">BOULIEDOU</span><span class="s">Global Business</span></span>
    </a>
    <nav class="nav-links" id="navlinks"></nav>
    <div class="nav-tools">
      <div class="lang" role="group" aria-label="Langue">
        <button id="lfr" class="on" onclick="setLang('fr')">FR</button>
        <button id="len" onclick="setLang('en')">EN</button>
      </div>
      <a class="btn btn-green desk-cta" href="#contact" data-i18n="nav_contact">Contact</a>
      <button class="burger" id="burger" aria-label="Menu"><span></span></button>
    </div>
  </div>
</div>

<main id="app"><!-- rendu dynamiquement --></main>

<!-- ============ FOOTER ============ -->
<footer>
  <div class="wrap">
    <div class="foot-top">
      <div class="foot-brand">
        <svg class="mk" viewBox="0 0 300 300" style="--mk-stroke:#F5EFDE;--mk-gold:#D8B65F"><use href="#bgb"/></svg>
        <p id="foot-about"></p>
      </div>
      <div class="foot-cols">
        <div class="foot-col">
          <h4 data-i18n="nav_nav">Navigation</h4>
          <div id="foot-nav"></div>
        </div>
        <div class="foot-col">
          <h4 data-i18n="nav_contact">Contact</h4>
          <div id="foot-phone"></div>
          <div id="foot-email"></div>
          <div id="foot-web"></div>
          <div id="foot-addr"></div>
        </div>
      </div>
    </div>
    <div class="foot-bottom">
      <div class="pill-line">Commerce · Agribusiness · Élevage · Prestations de services</div>
      <div>© <span id="yr"></span> Bouliedou Global Business. <span data-i18n="rights">Tous droits réservés.</span></div>
    </div>
  </div>
</footer>

<script>
/* =========================================================
   Bouliedou Global Business — moteur d'affichage
   Le CONTENU vient de content.json (modifiable via le tableau de bord).
   Le DESIGN (ci-dessus) ne change pas.
   ========================================================= */

var LANG = 'fr';
try { var s = localStorage.getItem('bgb-lang'); if (s) LANG = s; } catch(e){}

var CONTENT = null;

/* --- icônes des pôles (fixes) --- */
var POLE_ICONS = {
  commerce: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/>',
  agribusiness: '<path d="M12 21v-9"/><path d="M12 12c0-3.5 2.6-6 6.5-6 0 3.5-2.6 6-6.5 6z"/><path d="M12 14.5c0-3-2.3-5.5-6-5.5 0 3 2.3 5.5 6 5.5z"/>',
  elevage: '<path d="M6 10c0-3 2.4-5 6-5s6 2 6 5v2.5c0 3.2-2.7 5.5-6 5.5s-6-2.3-6-5.5z"/><path d="M6 10C3.8 9 2.5 7 2.5 4.5 5 4.5 6.6 6 7 8.2"/><path d="M18 10c2.2-1 3.5-3 3.5-5.5C19 4.5 17.4 6 17 8.2"/><path d="M10 13.5h.01M14 13.5h.01"/>',
  services: '<circle cx="12" cy="12" r="3.4"/><path d="M12 4.2V2.5M12 21.5v-1.7M19.8 12h1.7M2.5 12h1.7M17.5 6.5l1.2-1.2M5.3 18.7l1.2-1.2M17.5 17.5l1.2 1.2M5.3 5.3l1.2 1.2"/>'
};
var IMG_ICON = '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>';
var WA_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.057 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.56-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.82 9.82 0 001.599 5.35l-.999 3.648 3.889-1.02zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>';

/* libellés d'interface (fixes, bilingues) */
var UI = {
  nav_home:{fr:"Accueil",en:"Home"}, nav_poles:{fr:"Nos pôles",en:"Business"},
  nav_gallery:{fr:"Galerie",en:"Gallery"}, nav_about:{fr:"À propos",en:"About"},
  nav_why:{fr:"Pourquoi nous",en:"Why us"}, nav_contact:{fr:"Contact",en:"Contact"},
  nav_nav:{fr:"Navigation",en:"Navigation"}, rights:{fr:"Tous droits réservés.",en:"All rights reserved."},
  hero_wa:{fr:"Discuter sur WhatsApp",en:"Chat on WhatsApp"}, hero_write:{fr:"Nous écrire",en:"Contact us"},
  c_phone:{fr:"Téléphone",en:"Phone"}, c_addr:{fr:"Adresse",en:"Address"},
  f_name:{fr:"Votre nom",en:"Your name"}, f_name_ph:{fr:"Nom et prénom",en:"Full name"},
  f_email:{fr:"Votre e-mail",en:"Your email"}, f_email_ph:{fr:"vous@exemple.com",en:"you@example.com"},
  f_msg:{fr:"Votre message",en:"Your message"}, f_msg_ph:{fr:"Décrivez votre besoin…",en:"Tell us what you need…"},
  f_send:{fr:"Envoyer le message",en:"Send message"},
  f_note:{fr:"Le message ouvrira votre application e-mail, pré-rempli.",en:"This opens your email app with the message pre-filled."},
  find:{fr:"Nous trouver",en:"Find us"}, maps_btn:{fr:"Voir sur Google Maps",en:"View on Google Maps"},
  gal_note:{fr:"Ajoutez vos photos depuis le tableau de bord.",en:"Add your photos from the dashboard."},
  photo_soon:{fr:"Photo à venir",en:"Your photo"}
};
function t(k){ return (UI[k] && UI[k][LANG]) || (UI[k] && UI[k].fr) || ''; }
function L(obj, base){ return obj[base+'_'+LANG] || obj[base+'_fr'] || ''; }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  var c = CONTENT;
  var app = document.getElementById('app');
  var html = '';

  /* HERO */
  var h = c.hero || {};
  html += '<header class="hero" id="accueil"><div class="wrap hero-in">'
    + '<p class="eyebrow">'+esc(L(h,'eyebrow'))+'</p>'
    + '<h1>'+(L(h,'title'))+'</h1>'
    + '<p>'+esc(L(h,'text'))+'</p>'
    + '<div class="hero-cta">'
      + '<a class="btn btn-wa" id="wa1" href="#" target="_blank" rel="noopener">'+WA_SVG+'<span>'+t('hero_wa')+'</span></a>'
      + '<a class="btn btn-outline" href="#contact">'+t('hero_write')+'</a>'
    + '</div><div class="hero-chips">';
  (h.chips||[]).forEach(function(ch){ html += '<span class="chip"><span class="d"></span>'+esc(L(ch,'label'))+'</span>'; });
  html += '</div></div></header>';

  /* POLES */
  var p = c.poles || {};
  html += '<section class="sec" id="poles"><div class="wrap"><div class="sec-head">'
    + '<p class="kicker">'+esc(L(p,'kicker'))+'</p><h2>'+esc(L(p,'h2'))+'</h2>'
    + '<p class="intro">'+esc(L(p,'intro'))+'</p></div><div class="poles">';
  (p.items||[]).forEach(function(it){
    var ic = POLE_ICONS[it.icon] || POLE_ICONS.services;
    html += '<div class="pole"><div class="ic"><svg viewBox="0 0 24 24">'+ic+'</svg></div>'
      + '<h3>'+esc(L(it,'title'))+'</h3><p>'+esc(L(it,'text'))+'</p></div>';
  });
  html += '</div></div></section>';

  /* GALLERY */
  var g = c.gallery || {};
  html += '<section class="sec" id="galerie" style="background:var(--ivory)"><div class="wrap"><div class="sec-head">'
    + '<p class="kicker">'+esc(L(g,'kicker'))+'</p><h2>'+esc(L(g,'h2'))+'</h2>'
    + '<p class="intro">'+esc(L(g,'intro'))+'</p></div><div class="gal-grid">';
  (g.items||[]).forEach(function(it, i){
    if (it.image){
      html += '<div class="gtile has-img"><img src="'+esc(it.image)+'" alt="'+esc(L(it,'caption'))+'" loading="lazy">'
        + '<span class="cap">'+esc(L(it,'caption'))+'</span></div>';
    } else {
      var cls = (i%2===0)?'green':'cream';
      html += '<div class="gtile '+cls+'"><svg class="gic" viewBox="0 0 24 24">'+IMG_ICON+'</svg>'
        + '<span class="cap">'+esc(L(it,'caption'))+'</span><span class="ph">'+t('photo_soon')+'</span></div>';
    }
  });
  html += '</div><p class="gal-note">'+t('gal_note')+'</p></div></section>';

  /* ABOUT */
  var a = c.about || {};
  html += '<section class="sec about" id="apropos"><div class="wrap about-grid"><div>'
    + '<p class="kicker">'+esc(L(a,'kicker'))+'</p><h2>'+esc(L(a,'h2'))+'</h2>'
    + '<p>'+esc(L(a,'p1'))+'</p><p>'+esc(L(a,'p2'))+'</p></div><div class="badge-stack">';
  (a.cards||[]).forEach(function(cd){
    html += '<div class="vcard"><h4>'+esc(L(cd,'title'))+'</h4><p>'+esc(L(cd,'text'))+'</p></div>';
  });
  html += '</div></div></section>';

  /* WHY */
  var w = c.why || {};
  html += '<section class="why" id="pourquoi"><div class="wrap sec" style="padding-top:clamp(56px,8vw,90px);padding-bottom:clamp(56px,8vw,90px)">'
    + '<div class="sec-head"><p class="kicker">'+esc(L(w,'kicker'))+'</p><h2>'+esc(L(w,'h2'))+'</h2></div><div class="why-grid">';
  (w.items||[]).forEach(function(it,i){
    var n = (i+1)<10 ? '0'+(i+1) : ''+(i+1);
    html += '<div class="why-item"><div class="n">'+n+'</div><h3>'+esc(L(it,'title'))+'</h3><p>'+esc(L(it,'text'))+'</p></div>';
  });
  html += '</div></div></section>';

  /* CUSTOM SECTIONS (ajoutées depuis le tableau de bord) */
  (c.custom_sections||[]).forEach(function(cs, i){
    var bg = (i%2===0) ? 'var(--cream)' : 'var(--ivory)';
    var body = L(cs,'body').split(/\n\n+/).map(function(par){ return '<p>'+esc(par)+'</p>'; }).join('');
    html += '<section class="sec custom" style="background:'+bg+'"><div class="wrap"><div class="sec-head">'
      + '<p class="kicker">'+esc(L(cs,'kicker'))+'</p><h2>'+esc(L(cs,'title'))+'</h2></div>'
      + '<div class="ctext">'+body+'</div></div></section>';
  });

  /* CONTACT */
  var ct = c.contact || {};
  html += '<section class="sec" id="contact"><div class="wrap"><div class="sec-head">'
    + '<p class="kicker">'+esc(L(ct,'kicker'))+'</p><h2>'+esc(L(ct,'h2'))+'</h2>'
    + '<p class="intro">'+esc(L(ct,'intro'))+'</p></div><div class="contact-grid"><div class="cinfo">'
    + '<div class="line"><div class="ci"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.5 2.1L8.1 9.6a16 16 0 006 6l1.1-1.1a2 2 0 012.1-.5c.9.3 1.8.5 2.7.6a2 2 0 011.7 2z"/></svg></div>'
      + '<div><div class="lb">'+t('c_phone')+'</div><div class="vl">'+esc(ct.phone)+'</div></div></div>'
    + '<div class="line"><div class="ci"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg></div>'
      + '<div><div class="lb">Email</div><div class="vl">'+esc(ct.email)+'</div></div></div>'
    + '<div class="line"><div class="ci"><svg viewBox="0 0 24 24"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>'
      + '<div><div class="lb">'+t('c_addr')+'</div><div class="vl">'+esc(L(ct,'address'))+'</div></div></div>'
    + '<a class="btn btn-wa wa" id="wa2" href="#" target="_blank" rel="noopener">'+WA_SVG+'<span>'+t('hero_wa')+'</span></a>'
    + '</div><form id="cform">'
    + '<div class="field"><label>'+t('f_name')+'</label><input type="text" id="f_name" placeholder="'+t('f_name_ph')+'" required></div>'
    + '<div class="field"><label>'+t('f_email')+'</label><input type="email" id="f_email" placeholder="'+t('f_email_ph')+'" required></div>'
    + '<div class="field"><label>'+t('f_msg')+'</label><textarea id="f_msg" placeholder="'+t('f_msg_ph')+'" required></textarea></div>'
    + '<button type="submit" class="btn btn-green">'+t('f_send')+'</button>'
    + '<p class="formnote">'+t('f_note')+'</p></form></div>';
  var mq = encodeURIComponent(ct.maps_query||'Conakry, Guinée');
  html += '<div class="maps"><div class="mi"><div class="pin"><svg viewBox="0 0 24 24"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>'
    + '<div><div class="lb">'+t('find')+'</div><div class="vl">'+esc(L(ct,'address'))+'</div></div></div>'
    + '<a class="btn btn-gold" href="https://www.google.com/maps/search/?api=1&query='+mq+'" target="_blank" rel="noopener">'+t('maps_btn')+'</a></div>';
  html += '</div></section>';

  app.innerHTML = html;

  /* NAV links */
  var nav = '<a href="#accueil">'+t('nav_home')+'</a><a href="#poles">'+t('nav_poles')+'</a>'
    + '<a href="#galerie">'+t('nav_gallery')+'</a><a href="#apropos">'+t('nav_about')+'</a>';
  (c.pages||[]).forEach(function(pg){ nav += '<a href="/p/'+esc(pg.slug)+'">'+esc(L(pg,'title'))+'</a>'; });
  nav += '<a href="#contact">'+t('nav_contact')+'</a>';
  document.getElementById('navlinks').innerHTML = nav;

  /* FOOTER */
  document.getElementById('foot-about').textContent = L(c.footer||{},'about');
  var fnav = '<a href="#poles">'+t('nav_poles')+'</a><a href="#apropos">'+t('nav_about')+'</a>'
    + '<a href="#pourquoi">'+t('nav_why')+'</a><a href="#contact">'+t('nav_contact')+'</a>';
  document.getElementById('foot-nav').innerHTML = fnav;
  document.getElementById('foot-phone').textContent = ct.phone||'';
  document.getElementById('foot-email').textContent = ct.email||'';
  document.getElementById('foot-web').textContent = (c.footer&&c.footer.website)||'';
  document.getElementById('foot-addr').textContent = L(ct,'address');

  /* i18n statiques restants */
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });

  wireUp();
}

function wireUp(){
  var c = CONTENT, ct = c.contact||{};
  var waNum = ct.whatsapp || '224623010818';
  var waMsg = { fr:"Bonjour, je vous contacte via votre site web.", en:"Hello, I'm reaching out through your website." };
  var wl = 'https://wa.me/'+waNum+'?text='+encodeURIComponent(waMsg[LANG]||waMsg.fr);
  var w1=document.getElementById('wa1'), w2=document.getElementById('wa2');
  if(w1) w1.href=wl; if(w2) w2.href=wl;

  var navlinks=document.getElementById('navlinks');
  navlinks.querySelectorAll('a').forEach(function(a){ a.addEventListener('click',function(){navlinks.classList.remove('open');}); });

  var form=document.getElementById('cform');
  if(form){ form.addEventListener('submit',function(e){
    e.preventDefault();
    var n=document.getElementById('f_name').value, em=document.getElementById('f_email').value, m=document.getElementById('f_msg').value;
    var subj=(LANG==='en'?'Website message from ':'Message du site web de ')+n;
    var body=(LANG==='en'?'Name: ':'Nom : ')+n+'\n'+(LANG==='en'?'Email: ':'E-mail : ')+em+'\n\n'+m;
    window.location.href='mailto:'+(ct.email||'')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
  }); }
}

function setLang(l){
  LANG=l; document.documentElement.lang=l;
  document.getElementById('lfr').classList.toggle('on',l==='fr');
  document.getElementById('len').classList.toggle('on',l==='en');
  try{ localStorage.setItem('bgb-lang',l); }catch(e){}
  if(CONTENT) render();
}

document.getElementById('burger').addEventListener('click',function(){
  document.getElementById('navlinks').classList.toggle('open');
});
document.getElementById('yr').textContent=new Date().getFullYear();

fetch('content.json?v='+Date.now()).then(function(r){return r.json();}).then(function(data){
  CONTENT=data;
  document.getElementById('lfr').classList.toggle('on',LANG==='fr');
  document.getElementById('len').classList.toggle('on',LANG==='en');
  document.documentElement.lang=LANG;
  render();
}).catch(function(err){
  document.getElementById('app').innerHTML='<div class="wrap" style="padding:80px 0;text-align:center;color:#5B6B62">Chargement du contenu…</div>';
  console.error('content.json error:', err);
});
</script>
</body>
</html>
