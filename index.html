       long:{fr:["Un bureau à équiper avant une échéance, un projet qui démarre sans son matériel, une liste d'achats qui ne cesse de s'allonger… Trouver les bons équipements prend du temps, et chaque erreur coûte cher. Bouliedou Global Business vous libère de cette charge.","Mobilier, informatique et bureautique, équipements électriques, outillage, articles ménagers, consommables : chaque produit est sélectionné selon les caractéristiques que vous demandez et sa disponibilité chez nos fournisseurs. Confiez-nous votre liste ou votre cahier des charges, nous nous occupons du reste — recherche des fournisseurs, comparaison des offres, proposition claire avec prix, délais et livraison.","Un bon achat ne se juge pas seulement au prix affiché : avec vous, nous examinons la qualité, la compatibilité, la durabilité et l'entretien, et nous précisons les garanties avant la commande. Vous répondez à un appel d'offres ? Nous préparons une réponse construite sur les exigences du dossier."],
             en:["An office to equip before a deadline, a project starting without its equipment, a shopping list that keeps growing… Finding the right equipment takes time, and every mistake is costly. Bouliedou Global Business takes that burden off your hands.","Furniture, IT and office equipment, electrical equipment, tools, household items, consumables: each product is selected according to the specifications you request and its availability from our suppliers. Send us your list or specifications and we handle the rest — sourcing suppliers, comparing offers, and a clear proposal with prices, lead times and delivery.","A good purchase is not judged on the sticker price alone: together we look at quality, compatibility, durability and upkeep, and we confirm the warranties before ordering. Responding to a tender? We prepare an answer built on the requirements of the file."]},
       offers:{fr:["Mobilier & bureautique","Informatique & électronique","Outillage & équipements","Articles ménagers & consommables","Réponse aux appels d'offres"],en:["Furniture & office supplies","IT & electronics","Tools & equipment","Household items & consumables","Tender responses"]},
       audience:{fr:"Particuliers · entreprises et professionnels · institutions, ONG et associations · responsables de chantiers et porteurs de projets.",en:"Individuals · businesses and professionals · institutions, NGOs and associations · site managers and project leaders."}},
      {img:["img/metier-services-1.jpg","img/metier-services-2.jpg"],
       t:{fr:"Services et travaux",en:"Services & works"},
       d:{fr:"Bâtiment, rénovation, électricité, plomberie, énergie, eau, assainissement et aménagements.",en:"Building, renovation, electricity, plumbing, energy, water, sanitation and fitting-out."},
       lead:{fr:"Un seul interlocuteur, de la première visite à la réception des travaux.",en:"A single contact, from the first visit to the handover of the works."},
       long:{fr:["Construire, rénover, aménager, entretenir : un chantier mal préparé, c'est souvent un budget qui dérape et des délais qui s'allongent. Chez Bouliedou Global Business, nous préférons anticiper — conseil, appui opérationnel et interventions techniques pour mener vos projets avec méthode.","Bâtiment, réhabilitation, électricité, plomberie, aménagements intérieurs et extérieurs : notre champ d'action est large. Pour l'énergie, l'eau, l'assainissement ou les aménagements agricoles, nous nous entourons de partenaires spécialisés. Tout commence par l'écoute et, si nécessaire, une visite sur place pour définir précisément les interventions, les matériaux et les contraintes.","Une fois le projet lancé, nous mobilisons les équipes, organisons l'approvisionnement et suivons l'exécution — qualité, sécurité et respect du calendrier en priorité. Aucune modification sans votre accord, et une vérification complète prépare la réception des travaux."],
             en:["Building, renovating, fitting out, maintaining: a poorly prepared worksite often means a budget that slips and deadlines that stretch. At Bouliedou Global Business, we prefer to plan ahead — combining advice, operational support and technical work to run your projects methodically.","Building, rehabilitation, electricity, plumbing, indoor and outdoor fitting-out: our scope is broad. For energy, water, sanitation or agricultural works, we bring in specialist partners. It all starts with listening and, if needed, a site visit to define precisely the work, materials and constraints.","Once the project is launched, we mobilise the teams, organise supplies and monitor the work — quality, safety and on-time delivery come first. Nothing is changed without your agreement, and a full check prepares the handover of the works."]},
       offers:{fr:["Construction & réhabilitation","Électricité & plomberie","Aménagements intérieurs & extérieurs","Énergie, eau & assainissement","Maintenance, entretien & déménagement"],en:["Construction & rehabilitation","Electricity & plumbing","Indoor & outdoor fitting-out","Energy, water & sanitation","Maintenance, upkeep & removals"]},
       audience:{fr:"Particuliers · entreprises et professionnels · institutions, ONG et associations · exploitants et porteurs de projets agricoles.",en:"Individuals · businesses and professionals · institutions, NGOs and associations · farmers and agricultural project leaders."}},
      {img:["img/metier-formation-1.jpg","img/metier-formation-2.jpg"],
       t:{fr:"Formation & insertion",en:"Training & integration"},
       d:{fr:"Formation, renforcement des capacités et accompagnement des jeunes vers l'emploi.",en:"Training, capacity building and support for young people towards employment."},
       lead:{fr:"Développer les compétences. Ouvrir des portes. Bâtir l'autonomie.",en:"Build skills. Open doors. Create independence."},
       long:{fr:["Un diplôme ne suffit pas toujours à décrocher un premier emploi. Une bonne idée ne suffit pas toujours à créer une entreprise. Entre les deux, il manque souvent des compétences pratiques, de la méthode et un réseau. C'est précisément là que Bouliedou Global Business intervient.","Nous accompagnons les jeunes, les porteurs de projets et les équipes professionnelles dans le développement des compétences qui comptent vraiment — celles qui mènent à l'emploi, à l'entrepreneuriat et à une meilleure conduite des activités. Les jeunes femmes bénéficient d'une attention particulière. Ici, pas de théorie déconnectée : études de cas, mises en situation et outils concrets, pour repartir avec des acquis directement utilisables.","Plus qu'une formation, un accompagnement : rédaction de CV, préparation aux entretiens, construction du projet d'entreprise, et surtout des mises en relation avec des entreprises et des structures d'accompagnement — pour ouvrir l'accès aux opportunités de stage, d'apprentissage, d'emploi ou de développement d'activité."],
             en:["A diploma is not always enough to land a first job. A good idea is not always enough to start a business. Between the two, what is often missing is practical skills, method and a network. That is precisely where Bouliedou Global Business steps in.","We support young people, project leaders and professional teams in developing the skills that truly matter — those that lead to employment, entrepreneurship and better-run activities. Young women receive special attention. Here, no theory disconnected from reality: case studies, role-plays and concrete tools, so participants leave with skills they can use right away.","More than training, real support: writing a CV, preparing for interviews, building a business plan, and above all connecting people with companies and support organisations — to open access to internships, apprenticeships, jobs or business development."]},
       offers:{fr:["Préparation à l'emploi","Entrepreneuriat & gestion d'activité","Outils numériques & compétences pro","Accompagnement des jeunes femmes","Formations sur mesure pour équipes"],en:["Job readiness","Entrepreneurship & business management","Digital tools & professional skills","Support for young women","Tailor-made training for teams"]},
       audience:{fr:"Jeunes en recherche d'emploi · jeunes femmes · entrepreneurs et porteurs de projets · entreprises, institutions et organisations.",en:"Young job seekers · young women · entrepreneurs and project leaders · businesses, institutions and organisations."}},
      {img:["img/metier-commerce-1.jpg","img/metier-commerce-2.jpg"],
       t:{fr:"Commerce",en:"Trade"},
       d:{fr:"Import-export, achats en gros et distribution de marchandises, avec une place de choix pour les produits locaux.",en:"Import-export, wholesale purchasing and distribution of goods, with pride of place for local products."},
       lead:{fr:"Le bon produit, au juste prix, livré là où vous l'attendez.",en:"The right product, at the right price, delivered where you expect it."},
       long:{fr:["Trouver un fournisseur fiable, négocier, vérifier la marchandise, organiser le transport… Un approvisionnement réussi demande du temps, de l'expérience et un solide réseau. Bouliedou Global Business met tout cela à votre service.","Nous intervenons sur l'import-export, l'achat en gros, le regroupement et la distribution de marchandises, en mobilisant nos fournisseurs et partenaires en Guinée comme à l'international. Une place de choix est réservée aux productions locales : café, cacao, colas, riz, huile rouge, fruits et légumes — aux côtés d'autres biens de consommation.","Vous nous dites ce que vous cherchez ; nous précisons avec vous les caractéristiques, les quantités et la destination, puis nous pouvons vérifier la conformité, regrouper, conditionner et organiser l'acheminement. Prix, disponibilité et délais sont clarifiés avant la commande, et nous vous confions un interlocuteur dédié qui suit votre commande à chaque étape."],
             en:["Finding a reliable supplier, negotiating, checking the goods, arranging transport… A successful supply chain takes time, experience and a solid network. Bouliedou Global Business puts all of that at your service.","We handle import-export, wholesale purchasing, consolidation and distribution of goods, drawing on our suppliers and partners in Guinea and abroad. Pride of place goes to local products: coffee, cocoa, kola nuts, rice, red palm oil, fruits and vegetables — alongside other consumer goods.","You tell us what you are looking for; together we specify the characteristics, quantities and destination, then we can check conformity, consolidate, package and arrange delivery. Price, availability and lead times are clarified before ordering, and we assign you a dedicated contact who follows your order at every step."]},
       offers:{fr:["Import-export","Achats en gros & demi-gros","Distribution & approvisionnement régulier","Café, cacao & produits locaux","Recherche de produits sur demande"],en:["Import-export","Wholesale & semi-wholesale","Distribution & regular supply","Coffee, cocoa & local products","Product sourcing on request"]},
       audience:{fr:"Commerçants et revendeurs · entreprises, institutions et ONG · particuliers · producteurs et fournisseurs.",en:"Traders and resellers · businesses, institutions and NGOs · individuals · producers and suppliers."}}
    ]
  },

    lead:{fr:"Cinq métiers réunis sous une même enseigne, au service d'un même objectif : faire avancer nos clients et notre pays.",en:"Five businesses under one roof, serving a single goal: moving our clients and our country forward."},
    paras:{fr:["Bouliedou Global Business est une société guinéenne qui rassemble plusieurs métiers complémentaires sous une même enseigne. Notre conviction est simple : offrir à nos clients un interlocuteur unique, fiable et réactif, capable de les accompagner à chaque étape — de la conduite de leurs projets à la valorisation des produits locaux et au commerce.","Les besoins d'un ménage, d'une entreprise ou d'une institution mobilisent souvent plusieurs métiers complémentaires. En rassemblant ces expertises, nous simplifions la vie de nos clients et créons des ponts entre les filières — du producteur agricole jusqu'à l'acheteur final.","Ancrés localement et ouverts sur l'international, nous mettons la même exigence dans chacun de nos pôles. Nous accordons une place particulière à la valorisation des produits guinéens et à l'insertion des jeunes, notamment des jeunes femmes : notre réussite n'a de sens que si elle profite aussi à notre communauté."],
           en:["Bouliedou Global Business is a Guinean company that brings together several complementary businesses under one brand. Our belief is simple: give our clients a single, reliable and responsive partner, able to support them at every step — from running their projects to developing local products and trade.","The needs of a household, a business or an institution often call on several complementary trades. By bringing these skills together, we make our clients' lives simpler and build bridges between sectors — from the farmer to the final buyer.","Rooted locally and open to the world, we apply the same standard across every one of our businesses. We give particular importance to developing Guinean products and to the integration of young people, especially young women: our success only has meaning if it also benefits our community."]},
    mv:[{t:{fr:"Notre mission",en:"Our mission"},d:{fr:"Offrir à chaque client un partenaire unique, fiable et proche, capable de l'accompagner du commerce quotidien jusqu'à ses projets les plus ambitieux.",en:"Give every client a single, reliable and close partner, able to support them from everyday trade to their most ambitious projects."}},

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function waLink(txt){ return 'https://wa.me/'+WA+(txt?('?text='+encodeURIComponent(txt)):''); }
function waBtn(cls,label,txt){ return '<a class="btn '+cls+'" href="'+waLink(txt)+'" target="_blank" rel="noopener">'+label+'</a>'; }

}
function viewPourquoi(){var w=C.pourquoi;
  return '<div class="wrap sec"><p class="kicker">'+esc(L(w.kicker))+'</p><h2 class="big">'+esc(L(w.h2))+'</h2><p class="intro">'+esc(L(w.intro))+'</p>'
    +'<div class="why-grid">'+w.items.map(function(it,i){var n=(i+1)<10?'0'+(i+1):(i+1);return '<div class="why-item"><div class="n">'+n+'</div><h3>'+esc(L(it.t))+'</h3><p>'+esc(L(it.d))+'</p></div>';}).join('')+'</div></div>';
}
function viewRealisations(){var r=C.work;
  return '<div class="wrap sec"><p class="kicker">'+esc(L(r.kicker))+'</p><h2 class="big">'+esc(L(r.h2))+'</h2><p class="intro">'+esc(L(r.intro))+'</p>'
    +'<div class="rz-grid">'+r.items.map(function(it){return '<div class="rz-card"><div class="rz-img"><img src="'+it.img+'" alt="'+esc(L(it.title))+'" loading="lazy"></div><div class="rz-body"><span class="rz-tag">'+esc(L(it.tag))+'</span><h3>'+esc(L(it.title))+'</h3></div></div>';}).join('')+'</div></div>';
}
function viewContact(){var c=C.contact;
  return '<div class="wrap sec"><p class="kicker">'+esc(L(c.kicker))+'</p><h2 class="big">'+esc(L(c.h2))+'</h2><p class="intro">'+esc(L(c.intro))+'</p>'
    +'<div class="contact-grid">'
    +cinfo('📞',t('c_phone'),'+224 623 01 08 18','tel:'+TEL)
    +cinfo('💬',t('c_wa'),'+224 623 01 08 18',waLink(t('wa_hello2')))
    +cinfo('✉️',t('c_mail'),MAIL,'mailto:'+MAIL)
    +cinfo('📍',t('c_addr'),L(c.address),'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Enta marché, Conakry, Guinée'))
    +cinfo('🕒',t('c_hours'),L(c.hours),'')
    +cinfo('🌐',t('c_web'),'www.bouliedou.com','https://www.bouliedou.com')
    +'</div><div class="cta" style="margin-top:22px">'+waBtn('btn-gold',t('wa_write'),t('wa_hello2'))+'</div></div>';
}
function cinfo(ic,b,s,href){
  var inner='<span class="dot">'+ic+'</span><span><b>'+esc(b)+'</b><span>'+esc(s)+'</span></span>';
  if(href){ var ext=/^https?:/.test(href)?' target="_blank" rel="noopener"':''; return '<a class="cinfo" href="'+href+'"'+ext+'>'+inner+'</a>'; }
  return '<div class="cinfo">'+inner+'</div>';
}
var VIEWS={accueil:viewAccueil,apropos:viewApropos,poles:viewPoles,realisations:viewRealisations,pourquoi:viewPourquoi,contact:viewContact};

function setActiveTab(v){var tb=document.getElementById('tabs');tb.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});tb.classList.remove('open');}
function renderView(v){ if(!VIEWS[v]) v='accueil'; document.getElementById('app').innerHTML='<div class="view on">'+VIEWS[v]()+'</div>'; setActiveTab(v); window.scrollTo({top:0,behavior:'smooth'}); }
function renderMetier(i){ document.getElementById('app').innerHTML='<div class="view on">'+viewMetier(i)+'</div>'; setActiveTab('poles'); window.scrollTo({top:0,behavior:'smooth'}); }
function go(v){ if(!VIEWS[v]) v='accueil'; if(location.hash!=='#'+v){ try{history.pushState({v:v},'','#'+v);}catch(e){} } renderView(v); }
function openMetier(i){ if(location.hash!=='#pole-'+i){ try{history.pushState({pole:i},'','#pole-'+i);}catch(e){} } renderMetier(i); }
function showFromHash(){ var h=(location.hash||'#accueil').slice(1); if(h.indexOf('pole-')===0){ renderMetier(Number(h.slice(5))||0); } else { renderView(h); } }
window.addEventListener('popstate', showFromHash);

function buildTabs(){ document.getElementById('tabs').innerHTML=TABS.map(function(x){return '<button class="tab" data-v="'+x[0]+'" onclick="go(\''+x[0]+'\')">'+t(x[1])+'</button>';}).join(''); }
function buildLang(){ document.getElementById('lang').innerHTML=['fr','en'].map(function(l){return '<button class="'+(LANG===l?'on':'')+'" onclick="setLang(\''+l+'\')">'+l.toUpperCase()+'</button>';}).join(''); }
function applyMeta(){
  document.documentElement.lang=LANG;
  if(LANG==='en'){ document.title='Bouliedou Global Business — Agribusiness, supply, services & works, training and trade in Guinea';
    var m=document.querySelector('meta[name=description]'); if(m) m.content='Bouliedou Global Business, a Guinean company in Conakry: agribusiness, supply of goods, services & works, training and integration, trade. A single, reliable and close partner for your supplies, equipment and projects.'; }
}
function setLang(l){ if(l!==LANG){ LANG=l; try{localStorage.setItem('bgb_lang',l);}catch(e){} } buildTabs(); buildLang(); applyMeta(); showFromHash(); }

document.getElementById('yr').textContent=new Date().getFullYear();
buildLang(); buildTabs(); applyMeta(); showFromHash();
</script>
</body>
